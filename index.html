.bi-mini i:nth-child(1){grid-column:1;grid-row:1/4;background:#7d93ab}.bi-mini i:nth-child(2),.bi-mini i:nth-child(3){grid-column:2}
.bi-profiles,.bi-quotes,.bi-letters{grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr}.bi-profiles i,.bi-quotes i,.bi-letters i{grid-column:auto!important}

 "man.s1.title":"認識編輯器",
 "man.s1.lead":"左邊編輯、右邊即時預覽。第一次開啟時，介面語言會跟著你電腦（瀏覽器）的語言；左上角可隨時切換 繁體中文／한국어／English。",
 "man.s1.points":["依序完成四個分頁：① 基本資料 → ② 排版設計 → ③ 內容編輯 → ④ 匯出。", "右邊預覽就是印出來的樣子，每一頁固定為 A4。", "在「③ 內容編輯」時，直接點預覽中的文章或版塊標題，就能編輯它。", "拖曳中間的「⋮」可調整左右寬度；所有修改都會自動儲存在這台電腦的瀏覽器中。"],
 "man.s2.title":"填寫基本資料",
 "man.s2.lead":"在「① 基本資料」填寫這一期的資訊，會自動套用到每一頁的刊頭與頁尾。",
 "man.s2.points":["填寫學校英文名稱、主標題、月份、年度與期數；主標題就是刊頭的大字，例如「又松大學校友期刊」。", "副標題、發行單位與地址已預先填好，會跟著介面語言自動切換成中文、韓文或英文。", "自己改過的欄位會標示「已自訂」，切換語言也不會被改掉；按「恢復預設」可改回自動切換。", "按「選擇圖片」上傳學校 Logo；最下方的「重設示範內容」會清空全部內容，使用前請先備份。"],
 "man.s3.title":"一鍵套用整份期刊模板",
 "man.s3.lead":"在「② 排版設計 → 1 整份期刊模板」點一個模板，所有頁面的版面與範例內容一次排好。",
 "man.s3.points":["1、2、3、4 頁各有 4 款，配色分別是深紅、藏青、墨綠與三色融合；可用「全部／4 頁／3 頁／2 頁／1 頁」篩選。", "範例文字與相片位置都已排好，直接換成你的內容即可。", "如果已經寫了自己的內容，會先問你要「保留我的內容，只換版型」還是「換成範例內容」。", "套用後只顯示一行目前的模板；按「更換模板」可重新選，不滿意也可以按「復原」。"],
 "man.s4.title":"設計這一頁的版面",
 "man.s4.lead":"在「2 這一頁的版面」先點頁面縮圖選頁，再調整這一頁的外觀。",
 "man.s4.points":["頁面列可以新增、複製、刪除頁面，也能用 ← → 調整頁序。", "頁首樣式用圖示選：完整刊頭、精簡頁首或不顯示；續頁常用精簡頁首。", "校友報風格的頁面可以選刊頭插畫（4 款又松代表建築線稿、Logo 或自訂圖片）與刊頭版式。", "版型分「校友報風格」與「經典版型」；欄目抬頭樣式在「3」；按「套用到全部頁面」可統一整份期刊。"],
 "man.s5.title":"頁面、版塊與文章",
 "man.s5.lead":"在「③ 內容編輯」中，內容的結構是：頁面 → 版塊（欄目）→ 文章。",
 "man.s5.points":["版塊平常收合成一行，點一下就展開；在預覽中點版塊標題或文章，也會直接打開它。", "「版塊設定」可修改標題（可從建議清單選）、位置（左欄／中欄／右欄／全寬）與版塊樣式。", "「＋ 新增版塊」：校友報版型會先讓你用圖示挑選樣式，例如人物卡、引言、快訊。", "每篇文章分成「文字／圖片／字型」三個分頁；「刪除」放在文章與版塊的最下方，刪除前都會確認。"],
 "man.s6.title":"寫正文、放圖片",
 "man.s6.lead":"正文框就像文書軟體：直接打字，圖片會顯示在文字之間。",
 "man.s6.points":["在文字中點一下，再按「插入圖片」；也可以直接貼上（Ctrl+V）或把照片拖進框裡。", "用滑鼠拖動圖片即可換位置，藍色線就是放下的位置；把一張圖拖到另一張圖上就會並排。", "選取文字後按「粗體」或 Ctrl+B 加粗。", "主圖在文章的「圖片」分頁上傳，可調整裁切比例與顯示位置。"],
 "man.s7.title":"相片拼接",
 "man.s7.lead":"在文章的「圖片」分頁選一款拼接模板，上傳的相片會依序填進各格。",
 "man.s7.points":["共 6 款：雙圖交疊、雙圖並排、雙圖上下、三圖階梯、主圖＋三小圖、四宮格。", "上傳後用 ↑↓ 調整順序、「更換」換相片，用焦點滑桿選擇要顯示的部分。", "相片一律等比裁切、不會變形；不喜歡傾斜效果可以關掉「相片微傾斜」。", "相片不夠時會先顯示示範圖；插入到正文中的圖片不會進入拼接。"],
 "man.s8.title":"內容太多？自動接到下一頁",
 "man.s8.lead":"超出 A4 的頁面會出現紅框，一鍵就能把多出的內容接續到下一頁。",

 "man.s10.points":["草稿：輸入名稱後按「保存草稿」，之後可隨時「開啟」回來繼續編輯；草稿存在這台電腦的瀏覽器裡。", "PDF：按「列印／另存 PDF」，紙張選 A4、縮放 100%、邊界「無」，並勾選「背景圖形」。", "PNG：保存目前頁，或把所有頁打包成 ZIP；Canva：匯出可編輯的檔案，上傳到 Canva 繼續設計。", "換電腦或交給別人：用「匯出資料 JSON」，再用「匯入資料 JSON」開啟。"],

 "man.art.edit":"편집 영역",
 "man.art.preview":"실시간 미리보기",
 "man.s1.title":"편집기 둘러보기",
 "man.s1.lead":"왼쪽에서 편집하고 오른쪽에서 바로 미리 봅니다. 처음 열면 컴퓨터(브라우저) 언어로 화면이 표시되며, 왼쪽 위에서 언제든 繁體中文 / 한국어 / English로 바꿀 수 있습니다.",
 "man.s1.points":["네 개의 탭을 순서대로 진행합니다: ① 기본 정보 → ② 레이아웃 디자인 → ③ 콘텐츠 편집 → ④ 내보내기.", "오른쪽 미리보기가 인쇄되는 모습이며, 각 페이지는 A4로 고정됩니다.", "‘③ 콘텐츠 편집’에서 미리보기의 기사나 블록 제목을 바로 클릭하면 편집할 수 있습니다.", "가운데 ‘⋮’를 끌어 좌우 너비를 조절합니다. 모든 변경 내용은 이 컴퓨터의 브라우저에 자동 저장됩니다."],
 "man.s2.title":"기본 정보 입력",
 "man.s2.lead":"‘① 기본 정보’에 이번 호 정보를 입력하면 모든 페이지의 제호와 하단에 적용됩니다.",
 "man.s2.points":["학교 영문명, 주제목, 월, 연도, 호수를 입력합니다. 주제목은 제호의 큰 글자입니다(예: 우송대학교 동문 소식지).", "부제목, 발행 기관, 주소는 미리 입력되어 있으며 화면 언어에 따라 중국어·한국어·영어로 자동 전환됩니다.", "직접 고친 항목은 ‘직접 입력함’으로 표시되어 언어를 바꿔도 유지되며, ‘기본값으로’를 누르면 자동 전환으로 돌아갑니다.", "‘이미지 선택’으로 학교 로고를 올립니다. 맨 아래 ‘예시 콘텐츠로 초기화’는 모든 내용을 지우므로 먼저 백업하세요."],
 "man.s3.title":"호 전체 템플릿 한 번에 적용",
 "man.s3.lead":"‘② 레이아웃 디자인 → 1 호 전체 템플릿’에서 템플릿을 고르면 모든 페이지의 레이아웃과 예시 내용이 한 번에 배치됩니다.",
 "man.s3.points":["1·2·3·4페이지마다 4종씩 있으며 색은 진홍, 네이비, 그린, 삼색 조화입니다. ‘전체 / 4페이지 / 3페이지 / 2페이지 / 1페이지’로 걸러 볼 수 있습니다.", "예시 글과 사진 자리가 이미 배치되어 있어 내 내용으로 바꾸기만 하면 됩니다.", "이미 작성한 내용이 있으면 ‘내 내용 유지, 레이아웃만 변경’과 ‘템플릿 예시 내용으로 교체’ 중에서 고르도록 먼저 묻습니다.", "적용 후에는 현재 템플릿이 한 줄로 표시되며, ‘템플릿 변경’으로 다시 고르거나 ‘실행 취소’로 되돌릴 수 있습니다."],
 "man.s4.title":"이 페이지 디자인하기",
 "man.s4.lead":"‘2 이 페이지의 레이아웃’에서 먼저 페이지 미리보기를 고른 뒤 이 페이지의 모양을 정합니다.",
 "man.s4.points":["페이지 줄에서 페이지를 추가·복제·삭제하고, ← →로 순서를 바꿉니다.", "상단 스타일은 아이콘으로 고릅니다: 전체 제호, 간략 머리글, 표시 안 함. 속지에는 간략 머리글을 많이 씁니다.", "동문보 스타일 페이지에서는 제호 일러스트(우송 대표 건물 선화 4종, 로고, 직접 올린 이미지)와 제호 배치를 고를 수 있습니다.", "레이아웃은 ‘동문보 스타일’과 ‘기본 레이아웃’으로 나뉘며, 섹션 제목 스타일은 ‘3’에 있습니다. ‘모든 페이지에 적용’으로 호 전체를 통일하세요."],
 "man.s5.title":"페이지, 블록, 기사",
 "man.s5.lead":"‘③ 콘텐츠 편집’의 구조는 페이지 → 블록(섹션) → 기사입니다.",
 "man.s5.points":["블록은 평소 한 줄로 접혀 있으며 누르면 펼쳐집니다. 미리보기에서 블록 제목이나 기사를 눌러도 바로 열립니다.", "‘블록 설정’에서 제목(추천 목록에서 선택 가능), 위치(왼쪽 단 / 가운데 단 / 오른쪽 단 / 전체 너비), 블록 스타일을 바꿉니다.", "‘＋ 블록 추가’: 동문보 레이아웃에서는 인물 카드, 인용문, 단신 등 스타일을 아이콘으로 먼저 고릅니다.", "기사는 ‘텍스트 / 이미지 / 글꼴’ 탭으로 나뉩니다. ‘삭제’는 기사와 블록 맨 아래에 있으며 삭제 전에 확인합니다."],
 "man.s6.title":"본문 쓰고 이미지 넣기",
 "man.s6.lead":"본문 칸은 문서 편집기처럼 바로 입력하고, 이미지는 글 사이에 표시됩니다.",
 "man.s6.points":["글 사이를 클릭한 뒤 ‘이미지 넣기’를 누르거나, 붙여넣기(Ctrl+V) 또는 사진을 끌어다 놓으세요.", "이미지를 마우스로 끌어 위치를 바꿉니다. 파란 선이 놓일 위치이며, 다른 이미지 위에 놓으면 나란히 배치됩니다.", "글자를 선택하고 ‘굵게’ 또는 Ctrl+B를 누르세요.", "대표 이미지는 기사의 ‘이미지’ 탭에서 올리고, 자르기 비율과 보이는 위치를 조정합니다."],
 "man.s7.title":"사진 콜라주",
 "man.s7.lead":"기사의 ‘이미지’ 탭에서 콜라주 템플릿을 고르면 올린 사진이 칸에 차례대로 들어갑니다.",
 "man.s7.points":["6종: 두 장 겹치기, 두 장 나란히, 두 장 위아래, 세 장 계단식, 대표 + 작은 사진 3장, 4분할.", "올린 뒤 ↑↓로 순서를 바꾸고 ‘교체’로 사진을 바꾸며, 초점 슬라이더로 보이는 부분을 고릅니다.", "사진은 비율을 유지한 채 잘려 늘어나지 않습니다. 기울기가 싫으면 ‘사진 살짝 기울이기’를 끄세요.", "사진이 모자라면 예시 이미지가 먼저 보이며, 본문에 넣은 사진은 콜라주에 포함되지 않습니다."],
 "man.s8.title":"내용이 넘칠 때: 다음 페이지로 자동 이어쓰기",
 "man.s8.lead":"A4를 넘친 페이지는 빨간 테두리로 표시되고, 버튼 한 번으로 넘친 내용을 다음 페이지로 옮길 수 있습니다.",
 "man.s8.points":["위쪽 알림 줄의 ‘다음 페이지로 자동 이어서 배치’를 누르세요. 다음 페이지가 없으면 새로 만들고 레이아웃도 그대로 씁니다.", "이어지는 곳에는 ‘(다음 페이지에 계속)’과 ‘(앞 페이지에서 계속)’이 자동 표시됩니다.", "글이나 이미지를 고친 뒤에는 ‘페이지 이어짐 다시 자동 배치’로 다시 나눕니다.", "기사 맨 아래의 ‘커서 위치에서 나누기’나 ‘기사 전체를 다음 페이지로’로 직접 조정할 수도 있습니다."],
 "man.s9.title":"미리보기 방식 바꾸기",
 "man.s9.lead":"미리보기 위에서 ‘한 페이지’ ‘두 페이지’ ‘여러 페이지’를 골라 호 전체를 확인합니다.",
 "man.s9.points":["한 페이지: 100% 크기로 글자를 자세히 볼 때 좋습니다.", "두 페이지: 나란히 보기, 여러 페이지: 모든 페이지를 작게 봅니다.", "페이지를 누르면 그 페이지로 바뀌며, 한 페이지 보기에서 기사를 두 번 누르면 콘텐츠 편집으로 바로 이동합니다."],
 "man.s10.title":"내보내기, 임시 저장, 백업",
 "man.s10.lead":"‘④ 내보내기’에서 임시 저장하거나 PDF, PNG, Canva 파일을 만듭니다.",
 "man.s10.points":["임시 저장: 이름을 입력하고 ‘임시 저장’을 누르면 나중에 ‘열기’로 언제든 이어서 편집할 수 있습니다. 임시 저장본은 이 컴퓨터의 브라우저에 보관됩니다.", "PDF: ‘인쇄 / PDF로 저장’을 누르고 용지 A4, 배율 100%, 여백 ‘없음’, ‘배경 그래픽’을 선택하세요.", "PNG: 현재 페이지 또는 모든 페이지를 ZIP으로 저장합니다. Canva: 편집 가능한 파일로 내보내 Canva에서 이어서 디자인합니다.", "다른 컴퓨터로 옮기거나 전달할 때는 ‘JSON으로 백업’ 후 ‘JSON 불러오기’로 엽니다."],
 "man.s11.title":"실행 취소, 단축키, 저장",
 "man.s11.lead":"실수해도 괜찮습니다. 모든 작업은 되돌릴 수 있습니다.",
 "man.s11.points":["↶ 실행 취소(Ctrl+Z) / ↷ 다시 실행(Ctrl+Y), Ctrl+S로 바로 저장합니다.", "‘⌨ 단축키’를 누르면 모든 단축키를 볼 수 있습니다.", "데이터는 이 컴퓨터의 브라우저에 저장되어 브라우저 데이터를 지우면 사라집니다. 중요한 호는 임시 저장하고 JSON으로도 백업하세요.", "문제가 있으면 페이지 맨 아래 ‘문의하기’로 연락해 주세요."],

 "demo.c0":"애니메이션 데모: 템플릿으로 동문 소식지 한 호를 기본 정보부터 내보내기까지 만들어 봅니다. 데모가 끝나면 원래 내용이 복원됩니다.",
 "demo.c1":"① 기본 정보: 학교 이름, 주제목, 호수를 입력합니다. 부제목, 발행 기관, 주소는 화면 언어에 맞춰 자동으로 채워집니다.",

 "demo.c6":"‘이미지’ 탭에서 콜라주 템플릿을 고르면 올린 사진이 칸에 자동으로 들어갑니다.",
 "demo.c7":"‘＋ 블록 추가’를 누르고 아이콘으로 블록 스타일을 고른 뒤 제목과 내용을 입력합니다.",
 "demo.c8":"글이 A4를 넘치면 페이지에 빨간 테두리가 나타납니다…",
 "demo.c9":"‘다음 페이지로 자동 이어서 배치’를 누르면 넘친 내용이 다음 페이지로 옮겨지고 레이아웃도 그대로 유지됩니다.",
 "demo.c10":"미리보기를 ‘두 페이지’나 ‘여러 페이지’로 바꿔 호 전체를 확인합니다.",
 "demo.c11":"④ 내보내기: 임시 저장, PDF 인쇄, PNG와 Canva 파일 저장을 할 수 있습니다. (데모에서는 실제로 저장하거나 내려받지 않습니다)",
 "demo.c12":"완료! 데모가 끝났고 원래 내용이 복원되었습니다.",
 "demo.sub":"우송대학교 동문 소식지",

 "demo.a1.title":"2026 가을 신입생 공항 픽업 성료",
 "demo.a1.p1":"올가을 20여 개국에서 온 신입생들이 인천공항에 도착했고, 봉사단이 픽업부터 등록까지 함께했습니다.",
 "demo.a1.p2":"캠퍼스에 도착한 신입생들은 오리엔테이션에 참여해 학교생활과 학습 지원을 안내받았습니다.",

 "demo.blkText":"졸업한 지 10년, 우리는 여전히 우송에서의 날들을 자주 떠올립니다.",
 "demo.blk":"동문 근황",
 "demo.edit":"동문 여러분, 우송으로 돌아와 새로운 이야기를 함께 써 주세요.",

 "canva.title":"Canva 파일을 내려받았습니다",
 "canva.steps":["내려받은 파일: {file}", "아래 ‘Canva 열기’를 누르고 로그인합니다.", "이 파일을 Canva 홈 화면으로 끌어다 놓거나 ‘업로드’ → 파일 선택을 누릅니다.", "Canva가 편집 가능한 디자인으로 바꿔 주며, 스티커·배경·장식을 자유롭게 더할 수 있습니다."],
 "canva.note":"참고: 글꼴은 Canva의 비슷한 글꼴로 바뀔 수 있으니 Canva에서 다시 고르세요. 예시용 자리 이미지도 함께 내보내며, Canva에서 사진을 그 위로 끌어다 놓으면 바뀝니다. Canva에서 바꾼 내용은 이 편집기로 되돌아오지 않으므로 글은 여기서 먼저 확정하세요.",

 "man.s1.title":"Getting Around",
 "man.s1.lead":"Edit on the left and see the live preview on the right. On first visit the editor uses your computer’s (browser’s) language; switch between 繁體中文 / 한국어 / English at the top left any time.",
 "man.s1.points":["Work through the four tabs: ① Basic Information → ② Layout & Design → ③ Content Editor → ④ Export.", "The preview on the right is exactly what prints; every page is fixed at A4.", "In “③ Content Editor”, click an article or a block heading in the preview to edit it.", "Drag the “⋮” in the middle to resize the panels. Every change is saved automatically in this browser."],
 "man.s2.title":"Basic Information",
 "man.s2.lead":"Fill in this issue’s details in “① Basic Information”; they appear in the masthead and footer of every page.",
 "man.s2.points":["Enter the university name, main title, month, year and issue number. The main title is the large masthead text, e.g. “Woosong Alumni Newsletter”.", "Subtitle, publisher and address are filled in for you and switch automatically to Chinese, Korean or English with the interface language.", "A field you edit is marked “Customized” and is kept when the language changes; press “Use default” to make it automatic again.", "Upload the school logo with “Choose Image”. “Reset to Sample Content” at the bottom clears everything — back up first."],
 "man.s3.title":"Whole-Issue Templates in One Click",
 "man.s3.lead":"In “② Layout & Design → 1 Whole-issue template”, click a template and every page is laid out with sample content at once.",
 "man.s3.points":["There are 4 templates each for 1, 2, 3 and 4 pages, in crimson, navy, green and a tricolor mix; filter with “All / 4 pages / 3 pages / 2 pages / 1 page”.", "Sample text and photo spots are already placed — just replace them with your own.", "If you have already written content, you are asked whether to “Keep my content, change the layout” or “Use the template’s sample content”.", "Once applied, the template shows as one line; press “Change template” to choose again, or Undo."],
 "man.s4.title":"Designing This Page",
 "man.s4.lead":"In “2 This page’s layout”, first choose a page thumbnail, then shape that page.",
 "man.s4.points":["The page strip adds, duplicates and deletes pages; ← → reorder them.", "Pick the masthead with the icons: full masthead, compact header or none. Inner pages often use the compact header.", "On alumni paper pages, choose the masthead illustration (4 line drawings of Woosong landmarks, your logo or your own picture) and its arrangement.", "Layouts are grouped into “Alumni paper” and “Classic”; heading styles are in “3”. “Apply to all pages” keeps the whole issue consistent."],
 "man.s5.title":"Pages, Blocks and Articles",
 "man.s5.lead":"In “③ Content Editor” the structure is: page → block (section) → article.",
 "man.s5.points":["Blocks are folded to one line; click to open. Clicking a block heading or article in the preview opens it too.", "“Block settings” change the heading (pick from the suggestions if you like), placement (Left / Middle / Right / Full width) and block style.", "“+ Add Block”: on alumni paper layouts you first pick a style from icons, such as profile cards, quotes or news briefs.", "Each article has Text / Images / Typeface tabs. “Delete” sits at the bottom of each article and block, and always asks first."],
 "man.s6.title":"Writing Text and Adding Images",
 "man.s6.lead":"The body box works like a word processor: just type, and images appear between the lines.",
 "man.s6.points":["Click in the text and press “Insert Image”, or paste (Ctrl+V) or drag photos into the box.", "Drag an image to move it — the blue line shows where it lands; drop it on another image to place them side by side.", "Select text and press “Bold” or Ctrl+B.", "Upload the main image in the article’s “Images” tab and adjust its crop and visible area."],

 "man.s7.points":["Six templates: two overlapping, side by side, stacked pair, three-step stack, hero + three, and four grid.", "After uploading, use ↑↓ to reorder, “Replace” to swap a photo and the focus sliders to choose the visible part.", "Photos are cropped in proportion and never stretched; switch off “Slight photo tilt” if you prefer them straight.", "Empty slots show sample pictures; images placed in the body text are not part of the collage."],

/* First visit: follow the browser's language list (normally the computer's system language).
   Chinese (any region/script) → zh-TW, Korean → ko, English → en; otherwise English.
   A language the user picks with the buttons is saved and always wins. */
function browserLanguage(){
 const list=(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||'']).map(x=>String(x).toLowerCase());
 for(const tag of list){if(tag.startsWith('zh'))return 'zh-TW';if(tag.startsWith('ko'))return 'ko';if(tag.startsWith('en'))return 'en'}
 return 'en';
}
let currentLanguage=(()=>{try{const v=localStorage.getItem(LANG_KEY);if(v==='zh')return 'zh-TW';if(SUPPORTED_LANGUAGES.includes(v))return v}catch(e){}return browserLanguage()})();
function t(key,vars){
 let s=translations[currentLanguage][key];
 if(s===undefined){console.warn('[i18n] missing key',currentLanguage,key);s=key}
 if(vars&&typeof s==='string')s=s.replace(/\{(\w+)\}/g,(m,k)=>vars[k]!==undefined?vars[k]:m);
 return s;
}
const $=sel=>document.querySelector(sel);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shortId=()=>Math.random().toString(36).slice(2,8);
const IMG_TOKEN=/\[\[IMG:([a-z0-9]{3,12})\]\]/g;
const placedIds=text=>new Set([...String(text||'').matchAll(IMG_TOKEN)].map(m=>m[1]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const num=(v,d=50)=>{const n=Number(v);return Number.isFinite(n)?n:d};
const opt=(value,label,selected)=>`<option value="${esc(value)}"${selected?' selected':''}>${esc(label)}</option>`;

function newArticle(){return {id:uid(),title:'',body:'',image:'',qr:'',extraImages:[]}}
function normalizeArticle(a,legacy){
 a=a&&typeof a==='object'?a:{};
 const out={...a,id:a.id||uid(),title:String(a.title??''),body:String(a.body??''),image:typeof a.image==='string'?a.image:''};
 if(legacy){
  for(const [marker,tag] of LEGACY_SAMPLE_MARKERS){
   if(out.body===marker||out.body.startsWith(marker+'\n')){out.body=out.body.slice(marker.length).replace(/^\n/,'');out.sampleTag=tag;break}
  }
  if(LEGACY_DEFAULT_TITLES.includes(out.title))out.title='';
  if(LEGACY_DEFAULT_BODIES.includes(out.body))out.body='';
 }
 if(out.sampleTag!=='article'&&out.sampleTag!=='event')delete out.sampleTag;
 out.extraImages=(Array.isArray(a.extraImages)?a.extraImages:[]).map(im=>typeof im==='string'?{src:im,ratio:'original',fit:'contain',x:50,y:50}:im).filter(im=>im&&typeof im.src==='string'&&im.src).map(im=>im.id?im:{...im,id:shortId()});
 return out;
}
function normalizePart(x,legacy){
 x=x&&typeof x==='object'?x:{};
 let title=String(x.title??'');if(legacy&&LEGACY_DEFAULT_PARTS.includes(title))title='';
 const list=Array.isArray(x.articles)?x.articles:Array.isArray(x.stories)?x.stories:[];
 const part={id:x.id||uid(),title,position:POSITIONS.includes(x.position)?x.position:'full',articles:list.map(a=>normalizeArticle(a,legacy))};
 if(x.contOf)part.contOf=String(x.contOf);
 if(VARIANTS.includes(x.variant))part.variant=x.variant;
 if(WIDTHS.includes(x.width)&&x.width!=='half')part.width=x.width;
 return part;
}
function normalizePage(p,legacy){
 p=p&&typeof p==='object'?p:{};
 return {...(p.autoCreated?{autoCreated:true}:{}),id:p.id||uid(),header:HEADERS.includes(p.header)?p.header:'full',layout:LAYOUTS.includes(p.layout)?p.layout:'mode1',headingStyle:STYLES.includes(p.headingStyle)?p.headingStyle:'style1',parts:(Array.isArray(p.parts)?p.parts:[]).map(x=>normalizePart(x,legacy))};
}
/* Converts the old "left/right columns + extra parts" format into the unified Part model. */
function legacyPage(p,root){
 const pick=k=>p[k]!==undefined?p[k]:root[k];
 const parts=[
  {title:pick('leftLabel'),position:'left',articles:Array.isArray(pick('left'))?pick('left'):[]},
  {title:pick('rightLabel'),position:'right',articles:Array.isArray(pick('right'))?pick('right'):[]}
 ];
 for(const x of Array.isArray(p.parts)?p.parts:[])parts.push(x);
 return normalizePage({layout:pick('layout'),headingStyle:pick('headingStyle'),parts},true);
}
function normalizeData(raw){
 if(!raw||typeof raw!=='object'||Array.isArray(raw))throw new Error('invalid');
 const out={schema:2};
 for(const k of META_KEYS)out[k]=raw[k]==null?'':String(raw[k]);
 if(raw.mastTitle===undefined)out.mastTitle='NEWSLETTER';
 if(raw.schema===2){
  if(!Array.isArray(raw.pages))throw new Error('invalid');
  out.pages=raw.pages.map(p=>normalizePage(p,false));
 }else{
  const legacyPages=Array.isArray(raw.pages)&&raw.pages.length?raw.pages:null;
  if(!legacyPages&&!(Array.isArray(raw.left)&&Array.isArray(raw.right)))throw new Error('invalid');
  out.pages=(legacyPages||[raw]).map(p=>legacyPage(p&&typeof p==='object'?p:{},raw));
 }
 if(!out.pages.length)out.pages=[normalizePage({parts:[{title:'',position:'left'},{title:'',position:'right'}]},false)];
 out.metaAuto=normalizeMetaAuto(raw,out);
 if(typeof raw.issueTemplate==='string')out.issueTemplate=raw.issueTemplate;
 for(const k of ['mastArt','mastStyle','mastImage'])if(typeof raw[k]==='string'&&raw[k])out[k]=raw[k];
 return out;
}

function normalizeMetaAuto(raw,out){
 const given=raw.metaAuto&&typeof raw.metaAuto==='object'?raw.metaAuto:null,res={};
 for(const k of FIXED_KEYS){
  if(given&&typeof given[k]==='boolean'){res[k]=given[k];continue}
  const v=out[k];res[k]=v===''||Object.values(FIXED_META[k]).includes(v)||LEGACY_META_DEFAULTS[k].includes(v);
 }
 return res;
}

function loadData(){
 let rawText=null,raw=null;
 try{rawText=localStorage.getItem(STORAGE_KEY);raw=rawText?JSON.parse(rawText):null}catch(e){raw=null}
 if(!raw){
  if(rawText){try{localStorage.setItem(LEGACY_BACKUP_KEY+'-unreadable',rawText)}catch(e){}}
  return sample();
 }
 try{
  if(raw.schema!==2){try{if(!localStorage.getItem(LEGACY_BACKUP_KEY))localStorage.setItem(LEGACY_BACKUP_KEY,rawText)}catch(e){}}
  return normalizeData(raw);
 }catch(e){
  try{localStorage.setItem(LEGACY_BACKUP_KEY+'-unreadable',rawText)}catch(err){}
  return sample();
 }
}

/* ===== In-page dialogs =====
   The browser's own confirm and alert boxes are silently blocked in sandboxed previews (a confirm then
   answers "no", so deleting did nothing). These dialogs work everywhere and follow the interface language. */
function uiDialog(message,withCancel){
 return new Promise(resolve=>{
  const prev=document.activeElement,wrap=document.createElement('div');
  wrap.className='ui-dialog-overlay';
  wrap.innerHTML=`<div class="ui-dialog" role="${withCancel?'alertdialog':'dialog'}" aria-modal="true" aria-describedby="uiDialogMsg"><p id="uiDialogMsg"></p><div class="ui-dialog-actions">${withCancel?`<button type="button" class="btn secondary" id="uiDialogCancel">${esc(t('dialog.cancel'))}</button>`:''}<button type="button" class="btn" id="uiDialogOk">${esc(t('dialog.ok'))}</button></div></div>`;
  wrap.querySelector('#uiDialogMsg').textContent=message;
  const close=v=>{document.removeEventListener('keydown',onKey,true);wrap.remove();if(prev&&prev.isConnected)prev.focus();resolve(v)};
  const onKey=e=>{if(e.key==='Escape'){e.preventDefault();e.stopPropagation();close(false)}};
  wrap.addEventListener('click',e=>{if(e.target.id==='uiDialogOk')close(true);else if(e.target.id==='uiDialogCancel'||e.target===wrap)close(false)});
  document.addEventListener('keydown',onKey,true);
  document.body.appendChild(wrap);wrap.querySelector('#uiDialogOk').focus();
 });
}
const uiConfirm=msg=>uiDialog(msg,true),uiAlert=msg=>uiDialog(msg,false);

/* ===== Persistence ===== */
let saveTimer=null,saveState='idle',lastSaved=null,storageWarned=false;
/* ===== Undo / redo: snapshots of the data (image strings are shared, not copied) ===== */
let demoActive=false;
const HISTORY_MAX=80;let history=[],hIndex=-1,hTimer=null,restoring=false;
const cloneData=v=>Array.isArray(v)?v.map(cloneData):v&&typeof v==='object'?Object.fromEntries(Object.entries(v).map(([k,x])=>[k,cloneData(x)])):v;
const dataSig=d=>JSON.stringify(d,(k,v)=>typeof v==='string'&&v.length>300?v.length+':'+v.slice(-48):v);
function recordHistory(){
 if(demoActive)return;
 clearTimeout(hTimer);hTimer=null;const sig=dataSig(data);
 if(history[hIndex]&&history[hIndex].sig===sig){history[hIndex].page=pageIndex;return}
 history=history.slice(0,hIndex+1);history.push({sig,data:cloneData(data),page:pageIndex});
 if(history.length>HISTORY_MAX)history.shift();hIndex=history.length-1;paintHistory();
}
const flushHistory=()=>{if(hTimer)recordHistory()};
function scheduleHistory(){if(restoring||demoActive)return;clearTimeout(hTimer);hTimer=setTimeout(recordHistory,400)}
function paintHistory(){const u=$('#undoBtn'),r=$('#redoBtn');if(u)u.disabled=!(hIndex>0||hTimer);if(r)r.disabled=hIndex>=history.length-1}
function stepHistory(d){
 if(hTimer)recordHistory();
 const n=hIndex+d;if(n<0||n>=history.length)return;
 restoring=true;
 try{hIndex=n;const h=history[n];data=cloneData(h.data);pageIndex=Math.min(Math.max(0,h.page),data.pages.length-1);undoSnapshot=null;flowMessage=[];saveNow();renderPanels();renderPreview()}
 finally{restoring=false}
 paintHistory();
}
function persist(){if(demoActive)return;clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,250);scheduleHistory();paintHistory()}
function saveNow(){
 if(demoActive)return;
 clearTimeout(saveTimer);saveTimer=null;
 scheduleHistory();
 try{localStorage.setItem(STORAGE_KEY,JSON.stringify(data));saveState='saved';lastSaved=new Date()}
 catch(err){saveState='failed';if(!storageWarned){storageWarned=true;uiAlert(t('msg.storageFull'))}}
 paintStatus();
}
window.addEventListener('pagehide',()=>{if(saveTimer)saveNow()});
window.addEventListener('beforeunload',()=>{if(saveTimer)saveNow()});
function paintStatus(){
 const el=$('#saveStatus');if(!el)return;
 const text=saveState==='failed'?t('status.failed'):saveState==='saved'&&lastSaved?t('status.saved',{time:lastSaved.toLocaleTimeString(HTML_LANG[currentLanguage],{hour:'2-digit',minute:'2-digit',second:'2-digit'})}):t('status.autosave');
 el.classList.toggle('is-error',saveState==='failed');
 el.innerHTML='<span aria-hidden="true">●</span> '+esc(text);
}

 alumni:['동문 인물','hero',[['졸업 후에도, 우리는 같은 길 위에\n호텔·외식, 기술, 국제 비즈니스—세 동문의 우송 인연이 시간을 넘어 다시 이어집니다','「오랜만이에요!」 개교 30주년 문화축제 동문 모임에서 이 익숙한 인사로 서로 다른 분야의 세 동문이 다시 만났습니다. 졸업 후 호텔·외식 서비스, 인공지능 기술, 국제 비즈니스로 각자의 길을 걸었지만, 세 사람 모두 우송대학교가 전문성을 기르고 시야를 넓혀 준 소중한 출발점이었다고 말합니다.\n이번 재회는 지난 청춘을 추억하는 자리를 넘어, 서로 다른 분야에서 빛나는 서로를 확인하는 시간이었습니다. 「우리는 여전히 같은 길을 걷고 있어요.」']]],
 profiles:['','profiles',[['【호텔·외식 분야】\n장예연 (2016년 졸업)\n현직 | 글로벌 호텔 체인 운영 매니저','**『우송은 「서비스」의 진정한 의미를 가르쳐 주었습니다.』**\n우송의 호텔외식경영 수업과 실습, 국제 교류를 통해 전문 역량뿐 아니라 사람을 중심에 두는 서비스 마인드를 키웠습니다. 그 경험이 지금의 자신감이 되었습니다.'],['【기술·AI 분야】\n이승호 (2017년 졸업)\n현직 | AI 솔루션 기업 프로덕트 매니저','**『우송에서 시작해, 기술이 사람의 삶을 더 낫게 할 수 있음을 보았습니다.』**\n대학 시절 융합 프로젝트와 국제 팀 협업을 통해 열린 시야로 문제를 바라보는 법을 배웠습니다. 우송에 올 때마다 그때의 제가 떠오릅니다.'],['【국제 비즈니스 분야】\n김민서 (2015년 졸업)\n현직 | 글로벌 무역회사 아시아태평양 영업 매니저','**『우송은 세계로 나아갈 용기와 역량을 주었습니다.』**\n우송의 국제화된 환경에서 여러 나라의 친구와 문화를 만나며 다문화 소통과 국제 비즈니스 실무 역량을 길렀습니다.']]],
 campus30:['','mini',[['개교 30주년 캠퍼스 풍경','익숙한 캠퍼스 길을 걸으면 도서관, 강의동, 학생식당… 장면 하나하나가 그대로인 듯하면서도 세월의 온기가 더해져 있습니다. 개교 30주년을 맞아 많은 동문이 캠퍼스를 찾아 숲길에서 기념사진을 남겼습니다. 청춘과 다시 만나는 여정이었습니다.']]],
 teacher:['교수님 한마디','note',[['우송에서\n계속 만나기를 기대합니다','사랑하는 동문 여러분, 각자의 분야에서 빛나면서도 모교와의 인연을 이어 가는 모습을 보는 것이 교수로서 가장 큰 보람입니다. 우송대학교는 언제나 여러분의 집입니다. 경험을 나누러, 후배들을 이끌러, 동문 행사에 참여하러 언제든 찾아 주세요.\n—— 국제대학 진정호 교수']]],
 letters:['동문 편지:\n모교에 가장 하고 싶은 말','letters',[['—— 호텔관광경영학과 동문 채가은','우송에서 흥미를 찾고 전문성을 키웠으며, 평생의 동료들을 만났습니다. 고맙습니다.'],['—— 컴퓨터정보학과 동문 박지훈','어디에 있든 「우송인」이라는 사실이 자랑스럽습니다.'],['—— 국제경영학과 동문 임시함','국제적인 시야와 자신감을 준 모교 덕분에 더 큰 세상으로 나아갈 용기를 얻었습니다.']]],
 festival:['캠퍼스 소식','hero',[['국제문화축제:\n한 캠퍼스, 90여 개국','해마다 열리는 우송대학교 국제문화축제가 올해도 캠퍼스를 작은 지구촌으로 만들었습니다. 90여 개국 학생들이 전통 공연과 문화 체험, 대표 음식과 공예품을 선보이며 다양한 세계 문화의 매력을 전했습니다.\n열정적인 춤과 이야기가 담긴 전통 의상, 향긋한 세계 음식까지, 부스와 공연 하나하나에 고향 문화에 대한 학생들의 자부심이 담겨 있었습니다.',{collage:'hero4'}]]],
 fest30:['','story',[['우송축제 30주년: 청춘은 계속된다','우송축제가 올해 30주년을 맞았습니다! 우송대학교를 대표하는 축제로서 학생들의 재능과 열정을 펼치는 무대이자, 세대를 잇는 우송인의 청춘 기억입니다.\n올해는 「청춘은 계속된다」를 주제로 동아리 공연, 음악 무대, 플리마켓과 먹거리 부스가 어우러져 캠퍼스가 축제 분위기로 가득했습니다.',{collage:'pair2'}]]],
 orientation:['','story',[['신입생 환영 주간:\n새로운 만남, 익숙한 캠퍼스','새 학기 신입생 환영 주간이 캠퍼스에 활기를 불어넣었습니다. 캠퍼스 투어, 동아리 박람회, 선배와의 만남 등 다양한 프로그램으로 신입생들이 빠르게 우송 생활에 적응하도록 도왔습니다.']]],
 briefs:['캠퍼스 단신','briefs',[['신축 국제학생 기숙사 개관','새 국제학생 기숙사가 문을 열어 더 쾌적하고 다양한 생활·교류 공간을 제공합니다.'],['글로벌 협력 확대','해외 여러 대학과 새 협약을 맺어 교환·복수학위·공동연구 기회를 넓혀 갑니다.'],['학생팀 국제대회 수상','우리 학생들이 국제 혁신·창업 경진대회에서 두각을 나타내며 뛰어난 역량을 보여 주었습니다.'],['그린 캠퍼스 프로젝트 출범','에너지 절약과 탄소 감축, 자원 순환으로 지속 가능한 「그린 우송」을 만들어 갑니다.']]],
 quote:['','pullquote',[['','우송대학교에서 세계는 교과서 속 개념이 아니라, 매일 캠퍼스에서 만나고 나누고 함께 만들어 가는 일상의 풍경입니다.']]],
 song:['주제곡 프로젝트','hero',[['추억을 한 곡의 노래로\n「오랜만이에요」를 위한 우송 주제곡','「오랜만이에요」는 익숙한 인사를 넘어 시간을 건너 서로를 잇는 마음입니다. 이번 호에서는 「우송 동문 주제곡」 프로젝트를 시작합니다. 국내외 동문이 함께 기억과 글, 목소리로 우송인의 재회의 노래를 만듭니다.\n동문들이 보내 준 이야기에서 소중한 추억과 장면을 모으고 「강의동」, 「동아리」, 「시험 기간」, 「졸업」 같은 키워드를 정리한 뒤, AI 음악 생성 기술로 여러 멜로디와 편곡을 만들어 동문 투표로 최종 주제곡을 완성합니다.\n한 곡의 노래이자, 모두가 함께 완성하는 추억의 기록입니다.',{collage:'stair3'}]]],

 steps:['제작 과정','steps',[['추억 모으기','동문들의 이야기와 사진, 소중한 순간을 받습니다.'],['키워드 정리','캠퍼스의 이미지와 감정 키워드를 모아 주제를 정합니다.'],['멜로디 생성','동문이 함께 쓴 가사와 AI 음악 생성으로 다양한 곡을 만듭니다.'],['동문 합창','국내외 동문이 합창에 참여해 주제곡을 완성합니다.']]],
 songQuotes:['모교에 노래 한 곡을 선물한다면','quotes',[['—— 동문 장홍의 (2018학번)','도서관의 불빛과 동아리의 웃음소리, 그리고 그 익숙한 한마디 「오랜만이에요」를 노래에 담고 싶어요.'],['—— 동문 이흔이 (2020학번)','떠남과 돌아옴에 관한 노래, 떠난 뒤에도 우송을 마음에 품은 그리움에 관한 노래였으면 해요.'],['—— 동문 진우헌 (2016학번)','화려한 가사는 필요 없어요. 듣는 순간 이곳에서 함께 꿈꾸던 청춘이 떠오르면 충분해요.']]],

'en':{
 cover:['','cover',[['Long Time No See\nFirst Issue · Sending Our Memories Home','']]],
 editorial:["Editor's Note",'note',[['It Begins with\n"Long Time No See"','Dear Woosong alumni,\nWelcome to the first issue of the Woosong University Alumni Newsletter. Under the theme "Long Time No See", we hope to reconnect Woosong people around the world — to greet former teachers and classmates, to revisit the campus we know so well, and to meet again the years in which we worked, grew and dreamed.\nWherever you are today, this is where we all began. Let us send our memories home and keep writing the Woosong story together.']]],
 feature:['Feature','hero',[['Back to Where We First Met','In December 2025, Woosong University held its International Culture Festival. Students from more than 90 countries met Korean students to share food, traditional dress and dance. The China booth offered paper cutting, chopstick games and pitch-pot, and drew a steady crowd.\nThe busy stalls and cheering brought back memories of campus festivals and club life. Many alumni came back to meet current students and share their study and career stories. The energy of our university is still here — and so are the friendships that cross every border.',{collage:'overlap2'}]]],
 highlights:['','mini',[['30 Years of Campus Memories','Woosong University celebrates its 30th anniversary. From lecture halls to global exchange, we look back at three decades of growth.'],['International Culture Festival:\nOne Campus, 90+ Countries','Students from around the world shared food, dress, music and dance, turning Woosong into a small global village.']]],
 preview:['In This Issue','preview',[]],
 alumni:['Alumni Stories','hero',[['After Graduation, Still on the Same Road\nHospitality, technology and global business — three alumni meet again','"Long time no see!" At the alumni gathering of the 30th-anniversary culture festival, that familiar greeting brought together three graduates from very different fields. Since graduating, they have built careers in hospitality, artificial intelligence and international business — yet all three say Woosong was where they gained their expertise, widened their view and found their direction.\nThe reunion was more than nostalgia. It let them see each other shine in different fields, and agree once more: "We are still walking the same road."']]],
 profiles:['','profiles',[['【Hospitality】\nYerin Jang (Class of 2016)\nOperations Manager, global hotel chain','**"Woosong taught me what service really means."**\nThrough hospitality courses, internships and international exchange, I learned more than skills: I learned to put people first.'],['【Technology / AI】\nSeungho Lee (Class of 2017)\nProduct Manager, AI solutions company','**"Woosong showed me that technology can make life better for people."**\nInterdisciplinary projects and international teamwork taught me to think with an open mind. Every visit reminds me of the student who gave everything.'],['【Global Business】\nMinseo Kim (Class of 2015)\nAsia-Pacific Sales Manager, trading company','**"Woosong gave me the courage and skills to go global."**\nIn Woosong\'s international environment I met classmates and cultures from many countries and built real cross-cultural business skills.']]],
 campus30:['','mini',[['30 Years of Campus Memories','Walking the familiar paths — the library, the lecture halls, the student cafeteria — everything looks the same, yet warmer with time. For the 30th anniversary, many alumni came back for photos under the trees — a journey back to their youth.']]],
 teacher:['A Word from Faculty','note',[['Hoping to Meet You\nAgain at Woosong','Dear alumni, seeing you shine in your fields while staying connected to your university is the greatest reward for a teacher. Woosong will always be your home. Come back to share your experience, mentor students or join alumni events — you are always welcome.\n— Prof. Jeongho Jin, International College']]],
 letters:['Letters from\nAlumni','letters',[['— Ga-eun Chae, Hospitality & Tourism','Thank you, Woosong, for helping me find my passion, build my skills and meet friends for life.'],['— Jihoon Park, Computer Science','Wherever I go, I am proud to be a Woosong graduate.'],['— Shiham Lim, International Business','Thank you for the global view and confidence that gave me the courage to step into a bigger world.']]],
 festival:['Campus News','hero',[['International Culture Festival:\nOne Campus, 90+ Countries','Woosong\'s annual International Culture Festival once again turned the campus into a small global village. Students from more than ninety countries brought traditional performances, cultural activities, local food and crafts, letting everyone experience the richness of world cultures in one place.\nFrom lively dances and traditional costumes full of stories to the aromas of food from home, every booth and performance carried the students\' pride in their own cultures.',{collage:'hero4'}]]],
 fest30:['','story',[['Woosong Festival at 30: Youth Goes On','The Woosong Festival turned 30 this year! As the university\'s signature celebration, it is a stage for students\' talent and a shared memory for generations of Woosong people.\nUnder the theme "Youth Goes On", club shows, music stages, a creative market and food stalls filled the campus with festive energy.',{collage:'pair2'}]]],
 orientation:['','story',[['Welcome Week:\nNew Faces, Familiar Campus','Welcome Week filled the new semester with energy. Campus tours, a club fair and meetings with senior students helped freshmen find their way and settle into Woosong life.']]],
 briefs:['Campus Briefs','briefs',[['New International Dormitory Opens','A new international student dormitory offers more comfortable and diverse living and meeting spaces.'],['Global Partnerships Grow','New agreements with universities abroad expand exchange, dual-degree and research opportunities.'],['Student Team Wins Abroad','Woosong students stood out at an international innovation and start-up competition.'],['Green Campus Project Launches','"Green Woosong" brings energy saving, carbon reduction and recycling to a more sustainable campus.']]],
 quote:['','pullquote',[['','At Woosong University, the world is not a textbook idea — it is the everyday scene of meeting, sharing and creating together on campus.']]],
 song:['Theme Song Project','hero',[['Turning Memories into a Song\nA Woosong theme song for "Long Time No See"','"Long time no see" is more than a greeting; it is a feeling that connects us across time. This issue launches the Woosong Alumni Theme Song project, inviting alumni at home and abroad to write a song of reunion with their memories, words and voices.\nWe will gather stories and scenes from alumni, collect keywords such as "lecture hall", "club", "exam night" and "graduation", then use AI music tools to create melodies and arrangements for alumni to vote on and refine.\nIt is more than a song — it is a memory we finish together.',{collage:'stair3'}]]],
 keywords:['Lyric Keywords','keywords',[['Campus',''],['Reunion',''],['Youth',''],['Friends',''],['Dreams',''],['Far Away',''],['Home',''],['Woosong','']]],
 steps:['How It Works','steps',[['Collect Memories','Alumni send stories, photos and special moments.'],['Find Keywords','Campus images and feelings are gathered into a theme.'],['Create Melodies','Shared lyrics and AI music tools produce several styles.'],['Alumni Chorus','Alumni join the chorus to record the final song.']]],
 songQuotes:['If We Could Give Our University a Song','quotes',[['— Hongyi Zhang, entered 2018','I want the library lights, the laughter of our club and that familiar "long time no see" in the song.'],['— Xinyi Li, entered 2020','It should be about leaving and returning — about keeping Woosong in your heart after you go.'],['— Yuxuan Chen, entered 2016','No fancy words needed. Just something that brings back the years we dreamed together here.']]],
 closing:['','closing',[['','See you next time — never goodbye.']]]

function ceSerialize(root,partial){

 const last=()=>lines.length-1;
 const closeBold=()=>{if(open){lines[last()]+='**';open=false}};
 const newline=()=>{closeBold();lines.push('')};
 const flushPend=()=>{if(pend){pend=false;if(afterFig)afterFig=false;newline()}};
 const addText=(s,b)=>{s=s.replace(/ /g,' ').replace(/[​﻿]/g,'');if(!s)return;
  flushPend();if(afterFig){lines.push('');afterFig=false}
  const parts=s.split('\n');parts.forEach((piece,k)=>{if(k)newline();if(!piece)return;if(b!==open){lines[last()]+='**';open=b}lines[last()]+=piece});};
 const addFig=ids=>{pend=false;closeBold();if(lines[last()]!==''||afterFig)lines.push('');lines[last()]=ids.map(id=>`[[IMG:${id}]]`).join(' ');afterFig=true};
 const walk=(node,b)=>{for(const n of node.childNodes){
  if(n.nodeType===3){addText(n.nodeValue,b);continue}
  if(n.nodeType!==1||n.matches('.ce-x,.ce-drop-line'))continue;
  if(n.matches('figure.ce-fig')){const ids=[...n.querySelectorAll('[data-id]')].map(x=>x.dataset.id);if(ids.length)addFig(ids);continue}
  if(n.tagName==='BR'){
   if(/^(DIV|P|LI)$/.test(n.parentElement.tagName)&&n.parentElement!==root&&!n.nextSibling)continue;
   flushPend();if(afterFig){afterFig=false;lines.push('')}else newline();continue}

  const block=/^(DIV|P|LI|H[1-6]|BLOCKQUOTE)$/.test(n.tagName);
  if(block){if(pend)flushPend();else if(lines[last()]!==''||afterFig){if(afterFig){afterFig=false;lines.push('')}else newline()}}
  walk(n,bold);
  if(block)pend=true;
 }};
 walk(root,false);
 if(!partial)closeBold();
 let out=lines.join('\n');
 if(!partial&&root.lastChild&&root.lastChild.nodeName==='BR'&&out.endsWith('\n'))out=out.slice(0,-1);
 return out;
}

/* ===== Preview ===== */
/* Body markup is shared by the preview and the page-flow measurement so both lay out identically. */
const RATIO_CSS={square:'1/1',landscape:'4/3',wide:'16/9',portrait:'3/4'};
/* One picture in a collage or inline row. A single picture keeps its own proportions; several pictures
   share a tidy 4:3 cell (or the ratio chosen for that picture) so rows line up. */
function figImg(x,cols,mode){
 const natural=x.w&&x.h?`${x.w}/${x.h}`:'4/3',fixed=RATIO_CSS[x.ratio];
 const fit=fixed?'cover':cols===1?(x.fit==='cover'?'cover':'contain'):(mode==='grid-contain'?'contain':'cover');
 const pos=`object-fit:${fit};object-position:${num(x.x)}% ${num(x.y)}%`,src=`src="${esc(x.src)}" alt="${esc(t('preview.extraImageAlt'))}"`;
 /* A lone picture keeps its proportions, is centred and capped in height; width/height attributes give
    the browser its size before decoding so page-flow measuring is exact. */
 if(cols===1&&!fixed&&x.w&&x.h)return `<img class="article-image extra-preview gimg single natural" width="${x.w}" height="${x.h}" style="${pos}" ${src}>`;
 return `<img class="article-image extra-preview gimg${cols===1?' single':''}" style="aspect-ratio:${fixed||(cols===1?natural:'4/3')};${pos}" ${src}>`;
}
/* Body text with image codes ([[IMG:id]]) turned into pictures at that spot; codes on one line sit side by side. */
function richBody(a,text){
 const byId=new Map(a.extraImages.map(x=>[x.id,x]));let html='',buf=[];
 const flush=()=>{if(buf.length){html+=buf.map(l=>/^\s*—{1,2}\s/.test(l)?`<span class="sig">${inlineHTML(l,'strong')}</span>`:inlineHTML(l,'strong')).join('\n');buf=[]}};
 for(const line of String(text).split('\n')){
  const ids=[...line.matchAll(IMG_TOKEN)].map(m=>m[1]).filter(id=>byId.has(id));
  if(!ids.length){buf.push(line);continue}
  const rest=line.replace(IMG_TOKEN,'').trim();if(rest)buf.push(rest);
  flush();const k=Math.min(ids.length,3);
  html+=`<div class="inline-figs" style="grid-template-columns:repeat(${k},minmax(0,1fr))">${ids.map(id=>figImg(byId.get(id),ids.length===1?1:k,'grid-cover')).join('')}</div>`;
 }
 flush();return html;
}
/* ===== Photo collage templates =====

   template has its own real proportions. Pictures fill their slot with object-fit:cover (never stretched)
   and use the picture's own focus sliders (x / y) to choose the visible part. */
const CG_SLOTS={
 overlap2:{ar:1.45,s:[[0,0,80,56,-2],[17,41,83,59,1.6]]},
 pair2:{ar:2.05,s:[[0,5,52,88,-2.2],[47,3,53,92,1.8]]},
 stack2:{ar:.8,s:[[0,0,96,49,-1.2],[4,50,96,50,1.2]]},
 stair3:{ar:.66,s:[[0,0,90,35,-1.6],[8,31,92,35,1.4],[2,64,96,36,-1]]},
 hero4:{ar:1.25,s:[[0,0,100,61,0],[0,64,32.4,36,0],[33.8,64,32.4,36,0],[67.6,64,32.4,36,0]]},
 grid4:{ar:1.3,s:[[0,0,49,49,-1],[51,0,49,49,1],[0,51,49,49,1],[51,51,49,49,-1]]}
};
function collageHTML(a,list,seed){
 const tpl=CG_SLOTS[a.collage],tilt=a.collageTilt!==false,empty=!a.continuedFrom&&!a.continuesNext;
 if(!list.length&&!empty)return '';

  if(!x&&!empty)return '';
  const st=`left:${s[0]}%;top:${s[1]}%;width:${s[2]}%;height:${s[3]}%${rot?`;transform:rotate(${rot}deg)`:''}`;
  const inner=x?`<img class="extra-preview cg-img" style="object-position:${num(x.x)}% ${num(x.y)}%" src="${esc(x.src)}" alt="${esc(t('preview.extraImageAlt'))}">`
   :showDemo?`<div class="demo-visual cg-demo" data-label="${esc(t('sample.imagePlaceholder'))}">${illustration((seed||0)+k)}</div>`:`<span class="cg-empty">${k+1}</span>`;
  return `<figure class="cg-slot${x?'':' is-empty'}" style="${st}">${inner}</figure>`}).join('');

}

function insertRowsAt(body,offset,ids){
 body=String(body);let off=offset==null?body.length:safeCut(body,Math.min(Math.max(0,offset),body.length));
 let before=body.slice(0,off),after=body.slice(off);

/* Snap a drop point to the paragraph boundary nearest the pointer, so pictures land between paragraphs

function dropSpot(ed,x,y){

 let node=r.startContainer;if(node===ed){node=ed.childNodes[Math.min(r.startOffset,ed.childNodes.length-1)];if(!node)return {range:r,y:ed.getBoundingClientRect().top+8}}

 const isBreak=n=>n&&n.nodeType===1&&(n.tagName==='BR'||n.matches('figure.ce-fig'));
 let first=node,last=node;
 if(!(node.nodeType===1&&/^(DIV|P)$/.test(node.tagName))){
  if(isBreak(node)){const prev=node.previousSibling;if(prev&&!isBreak(prev)){first=last=prev}else{const g=document.createRange();g.setStartBefore(node);g.collapse(true);return {range:g,y:node.getBoundingClientRect().top}}}
  while(first.previousSibling&&!isBreak(first.previousSibling))first=first.previousSibling;
  while(last.nextSibling&&!isBreak(last.nextSibling))last=last.nextSibling;

function readImage(file,callback,kind,onFail){

  if(kind!=='mastimg'){ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height)}ctx.drawImage(img,0,0,canvas.width,canvas.height);

<section class="manual-main"><div class="manual-top"><span class="manual-count">${esc(t('man.step',{n:i+1,total:MANUAL_STEPS}))}</span><button type="button" class="demo-play demo-play-narrow" data-man="demo">${esc(t('demo.play'))}</button><button type="button" class="manual-x" data-man="close" aria-label="${esc(t('man.close'))}" title="${esc(t('man.close'))}">✕</button></div>
<h2 id="manualTitle">${esc(t(`man.s${i+1}.title`))}</h2><div class="manual-art">${manualArt(i)}</div><p class="manual-lead">${esc(t(`man.s${i+1}.lead`))}</p><ul class="manual-points">${points.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
<div class="manual-dots" aria-hidden="true">${Array.from({length:MANUAL_STEPS},(_,k)=>`<span${k===i?' class="on"':''}></span>`).join('')}</div>
<div class="manual-foot"><label class="manual-check"><input type="checkbox" id="manualDontShow"${seen||manualAuto?' checked':''}> ${esc(t('man.dontShow'))}</label><div class="manual-buttons"><button type="button" class="btn secondary" data-man="show">${esc(t('man.show'))}</button><button type="button" class="btn secondary" data-man="prev"${i===0?' disabled':''}>${esc(t('man.prev'))}</button><button type="button" class="btn" data-man="${last?'close':'next'}">${esc(t(last?'man.done':'man.next'))}</button></div></div></section></div>`;

let manualAuto=false;
function openManual(step,auto){
 manualAuto=!!auto;if(step!==undefined)manualStep=Math.min(Math.max(0,step),MANUAL_STEPS-1);
 document.querySelector('.manual-back')?.remove();
 let ov=$('#manualOverlay');if(!ov){ov=document.createElement('div');ov.id='manualOverlay';ov.className='manual-overlay';document.body.appendChild(ov)}
 ov.innerHTML=manualHTML();ov.classList.add('is-open');ov.querySelector('[data-man="next"],[data-man="close"].btn')?.focus();
}
function closeManual(){
 const ov=$('#manualOverlay');if(!ov)return;
 const cb=$('#manualDontShow');try{if(!cb||cb.checked)localStorage.setItem(MANUAL_KEY,'1');else localStorage.removeItem(MANUAL_KEY)}catch(e){}
 ov.classList.remove('is-open');ov.innerHTML='';$('#manualBtn')?.focus();
}
/* "Show me": close the manual, open the right module and pulse the real control. */
function showMe(i){
 closeManual();
 const tab=[null,'info','layout','layout','content','content','content','content',null,'export',null][i];if(tab)showTab(tab);
 if(i===2&&!document.querySelector('.issue-browser'))issueBrowse=true,renderDesign();
 if(i===5||i===6){const pc=document.querySelector('#partsEdit .part-card');if(pc&&!pc.classList.contains('is-open'))pc.querySelector('[data-act="part-toggle"]')?.click();const it=document.querySelector('#partsEdit .article-item');if(it){const btn=it.querySelector('[data-act="art-toggle"]');if(btn&&btn.getAttribute('aria-expanded')!=='true')btn.click();it.querySelector(`[data-act="art-tab"][data-panel="${i===6?'img':'text'}"]`)?.click()}}
 const sel=['.ux-nav','#metadata','.issue-browser,.ds-summary','#styleEdit .page-strip','#partsEdit .part-card','#partsEdit .ce-field','#partsEdit .cg-picker','#overflowWarning:not([hidden]),#pagesPanel','.preview-toolbar','#draftPanel','.ux-actions'][i];
 const el=[...document.querySelectorAll(sel)].find(x=>x.offsetParent!==null);
 if(el){el.scrollIntoView({block:'center',behavior:'smooth'});el.classList.remove('tour-spot');void el.offsetWidth;el.classList.add('tour-spot');setTimeout(()=>el.classList.remove('tour-spot'),3600)}
 const back=document.createElement('button');back.type='button';back.className='manual-back';back.textContent='↩ '+t('man.back');back.addEventListener('click',()=>openManual(i));
 document.body.appendChild(back);setTimeout(()=>back.remove(),12000);
}
document.addEventListener('click',e=>{const ov=$('#manualOverlay');if(!ov||!ov.classList.contains('is-open'))return;
 if(e.target===ov){closeManual();return}
 const step=e.target.closest('[data-man-step]');if(step){openManual(Number(step.dataset.manStep),manualAuto);return}
 const b=e.target.closest('[data-man]');if(!b)return;const a=b.dataset.man;
 if(a==='demo'){runDemo();return}
 if(a==='close')closeManual();else if(a==='next')openManual(manualStep+1,manualAuto);else if(a==='prev')openManual(manualStep-1,manualAuto);else if(a==='show')showMe(manualStep);
});
document.addEventListener('keydown',e=>{const ov=$('#manualOverlay');if(!ov||!ov.classList.contains('is-open'))return;
 if(e.key==='Escape'){e.preventDefault();closeManual()}
 else if(e.key==='ArrowRight'&&manualStep<MANUAL_STEPS-1&&!e.target.matches('input')){e.preventDefault();openManual(manualStep+1,manualAuto)}
 else if(e.key==='ArrowLeft'&&manualStep>0&&!e.target.matches('input')){e.preventDefault();openManual(manualStep-1,manualAuto)}
});

/* ===== Animated demo: a visible cursor builds an issue from scratch in the real editor =====
   The user's data is snapshotted first; saving and history are paused; everything is restored at the end. */
let demoStop=false,demoSpeed=1,demoSnap=null;
const DEMO_PACE=1.3; /* base tempo: a full run at 1× takes about a minute */
class DemoStopped extends Error{}
const dsleep=ms=>new Promise((res,rej)=>{const end=Date.now()+ms/(demoSpeed*DEMO_PACE);(function tick(){if(demoStop)return rej(new DemoStopped());if(Date.now()>=end)return res();setTimeout(tick,Math.min(60,end-Date.now()))})()});
const visible=sel=>[...document.querySelectorAll(sel)].find(x=>x.offsetParent!==null||x.getClientRects().length);
async function demoFind(sel,timeout=4000){const end=Date.now()+timeout;for(;;){const el=visible(sel);if(el)return el;if(Date.now()>end)throw new Error('demo: missing '+sel);await dsleep(80)}}
function demoUI(){
 const wrap=document.createElement('div');wrap.id='demoLayer';
 wrap.innerHTML=`<div class="demo-blocker"></div><div class="demo-cursor" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 2l16 11-7 1.5 4 7.5-3 1.5-4-7.5L4 21z" fill="#fff" stroke="#111" stroke-width="1.5" stroke-linejoin="round"/></svg></div><div class="demo-bar" role="status" aria-live="polite"><span class="demo-badge">${esc(t('demo.label'))}</span><p class="demo-caption"></p><div class="demo-controls"><button type="button" class="demo-speed">${esc(t('demo.fast'))}</button><button type="button" class="demo-stop">${esc(t('demo.stop'))}</button></div></div>`;
 document.body.appendChild(wrap);
 wrap.querySelector('.demo-stop').addEventListener('click',()=>{demoStop=true});
 wrap.querySelector('.demo-speed').addEventListener('click',e=>{demoSpeed=demoSpeed===1?2:1;e.target.textContent=t(demoSpeed===1?'demo.fast':'demo.normal')});
 const c=wrap.querySelector('.demo-cursor');c.style.transform=`translate(${innerWidth/2}px,${innerHeight/2}px)`;
 return wrap;
}
const demoCursor=()=>document.querySelector('#demoLayer .demo-cursor');
async function caption(key,vars,hold=1400){const el=document.querySelector('#demoLayer .demo-caption');el.classList.remove('show');void el.offsetWidth;el.textContent=t(key,vars);el.classList.add('show');await dsleep(hold)}
async function moveTo(el,dx=0.5,dy=0.5){
 el.scrollIntoView({block:'center',inline:'nearest',behavior:'smooth'});await dsleep(380);
 const r=el.getBoundingClientRect(),c=demoCursor();c.style.transitionDuration=(0.65/(demoSpeed*DEMO_PACE))+'s';
 c.style.transform=`translate(${r.left+r.width*dx}px,${r.top+r.height*dy}px)`;await dsleep(720);
}
async function tap(el,doClick=true){
 await moveTo(el);const r=el.getBoundingClientRect(),dot=document.createElement('div');dot.className='demo-ripple';
 dot.style.left=(r.left+r.width/2)+'px';dot.style.top=(r.top+r.height/2)+'px';document.getElementById('demoLayer').appendChild(dot);setTimeout(()=>dot.remove(),700);
 demoCursor().classList.add('press');await dsleep(140);demoCursor().classList.remove('press');
 if(doClick)el.click();await dsleep(420);
}
async function typeInto(el,text,per=26){await moveTo(el);el.focus();for(const ch of text){if(demoStop)throw new DemoStopped();el.value+=ch;el.dispatchEvent(new Event('input',{bubbles:true}));await dsleep(per)}}
function caretToEnd(ed){ed.focus();const r=document.createRange();r.selectNodeContents(ed);r.collapse(false);const s=getSelection();s.removeAllRanges();s.addRange(r)}
async function typeCE(ed,text,per=24,chunk=2){caretToEnd(ed);for(let i=0;i<text.length;i+=chunk){if(demoStop)throw new DemoStopped();document.execCommand('insertText',false,text.slice(i,i+chunk));await dsleep(per)}}
async function selectOption(sel,value){await tap(sel,false);sel.value=value;sel.dispatchEvent(new Event('change',{bubbles:true}));await dsleep(500)}
function demoImage(kind){
 return new Promise(res=>{const c=document.createElement('canvas');c.width=960;c.height=640;const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,640);g.addColorStop(0,kind?'#ffd9a8':'#9fd0f5');g.addColorStop(1,kind?'#fff2df':'#e8f5ff');x.fillStyle=g;x.fillRect(0,0,960,640);
  x.fillStyle=kind?'#f59f4c':'#ffffff';x.beginPath();x.arc(760,130,70,0,7);x.fill();
  x.fillStyle=kind?'#5b8f6a':'#5d7fa3';x.fillRect(0,470,960,170);
  const blds=kind?[[90,260,170,220,'#c96f4a'],[300,200,210,280,'#e3a45a'],[560,250,160,230,'#b85d3c']]:[[60,300,330,180,'#e6eef6'],[420,240,420,240,'#d4e2ef']];
  for(const [bx,by,bw,bh,bc] of blds){x.fillStyle=bc;x.fillRect(bx,by,bw,bh);x.fillStyle='#ffffffaa';for(let wy=by+24;wy<by+bh-30;wy+=46)for(let wx=bx+20;wx<bx+bw-30;wx+=46)x.fillRect(wx,wy,24,26)}
  for(let i=0;i<9;i++){const px=120+i*85,py=520+(i%2)*18;x.fillStyle=['#2f5f8f','#c2453a','#3c8d5f','#7b4fa0'][i%4];x.beginPath();x.arc(px,py-38,15,0,7);x.fill();x.fillRect(px-14,py-22,28,46)}
  if(!kind){x.fillStyle='#ffffff';x.beginPath();x.moveTo(170,120);x.lineTo(420,150);x.lineTo(170,180);x.closePath();x.fill();x.fillRect(240,95,40,110)}
  c.toBlob(b=>res(new File([b],kind?'campus.png':'airport.png',{type:'image/png'})),'image/png')});
}
function blankIssue(){return {schema:2,university:'',mastTitle:'',subtitle:'',month:'',year:'',volume:'',issuer:'',address:'',logo:'',metaAuto:{subtitle:true,issuer:true,address:true},pages:[normalizePage({layout:'mode1',headingStyle:'style1',parts:[]},false)]}}
async function demoScript(){
 /* Follows the current workflow; every caption and every typed word comes from the active language. */
 const W=dsleep,upload=async(input,files)=>{const dt=new DataTransfer();files.forEach(f=>dt.items.add(f));input.files=dt.files;input.dispatchEvent(new Event('change',{bubbles:true}));await W(1400)};
 await caption('demo.c0',null,2600);
 // ① basic information — subtitle, publisher and address are already filled in for this language
 await tap(await demoFind('.ux-tab[data-tab="info"]'));await caption('demo.c1',null,600);
 for(const [k,v] of [['university','Woosong University'],['mastTitle',t('demo.mast')],['month','11'],['year','2026'],['volume','1']])await typeInto(await demoFind(`#meta-${k}`),v,k==='mastTitle'?70:45);
 await moveTo(await demoFind('#meta-subtitle'));await W(600);await moveTo(await demoFind('#meta-address'));await W(700);
 // ② whole-issue template, masthead, page strip
 await tap(await demoFind('.ux-tab[data-tab="layout"]'));await caption('demo.c2',null,600);
 await tap(await demoFind('[data-act="issue-filter"][data-n="2"]'));await W(500);
 await tap(await demoFind('[data-tpl="n2d"]'));await W(900);
 const keep=document.querySelector('.issue-dialog [data-choice="sample"]');if(keep)await tap(keep);
 await caption('demo.c3',null,500);
 await tap(await demoFind('[data-act="mast-art"][data-art="w13"]'));await W(500);
 await tap(await demoFind('[data-act="mast-style"][data-style="right"]'));await W(700);
 await tap(await demoFind('#styleEdit .ps-page[data-page="1"]'));await W(500);
 await tap(await demoFind('[data-act="header-pick"][data-header="full"]'));await W(700);
 await tap(await demoFind('[data-act="header-pick"][data-header="compact"]'));await W(500);
 // ③ click an article in the preview → it opens on the left
 await tap(await demoFind('.ux-tab[data-tab="content"]'));
 await tap(await demoFind('#pagesPanel .ps-page[data-page="0"]'));await caption('demo.c4',null,500);
 const target=await demoFind('#pagesStack .nex-sheet[data-sheet="0"] .pa-hero');const aid=target.dataset.aid;
 await tap(target);await W(900);
 await caption('demo.c5',null,400);
 let ed=await demoFind(`#partsEdit .article-item[data-aid="${aid}"] .ce-editor`);await moveTo(ed,0.4,0.6);
 caretToEnd(ed);document.execCommand('insertLineBreak');await typeCE(ed,t('demo.edit'));await W(400);
 const word=t('demo.bold'),walker=document.createTreeWalker(ed,NodeFilter.SHOW_TEXT);let n;
 while(n=walker.nextNode()){const k=n.nodeValue.indexOf(word);if(k>-1){const r=document.createRange();r.setStart(n,k);r.setEnd(n,k+word.length);ed.focus();const sel=getSelection();sel.removeAllRanges();sel.addRange(r);break}}
 await W(500);await tap(await demoFind(`#partsEdit .article-item[data-aid="${aid}"] [data-act="ce-bold"]`));await W(600);
 // photo collage
 await caption('demo.c6',null,400);
 await tap(await demoFind(`#partsEdit .article-item[data-aid="${aid}"] [data-act="art-tab"][data-panel="img"]`));await W(400);
 await tap(await demoFind(`#partsEdit .article-item[data-aid="${aid}"] [data-act="collage-pick"][data-collage="pair2"]`));await W(600);
 const files=await Promise.all([demoImage(0),demoImage(1)]);
 const label=await demoFind(`#partsEdit .article-item[data-aid="${aid}"] .additional-photo-section .nex-file-control`);await tap(label,false);
 await upload(label.querySelector('input'),files);
 const card=document.querySelector(`#pagesStack .article[data-aid="${aid}"] .extra-gallery.cg`);if(card){await moveTo(card);await W(1200)}
 // add a block from the style picker, then write until the page overflows
 await caption('demo.c7',null,400);

 await tap(await demoFind('#partsEdit .blk-pick[data-variant="story"]'));await W(500);
 await typeInto(await demoFind('#partsEdit .part-card:last-of-type [data-part-field="title"]'),t('demo.blk'),60);

 ed=await demoFind('#partsEdit .part-card:last-of-type .ce-editor');await moveTo(ed,0.3,0.4);
 await typeCE(ed,t('demo.blkText'));await caption('demo.c8',null,300);
 const overflowing=()=>!!document.querySelector('#pagesStack .sheet-flow-bar:not([hidden])');
 for(let k=1,extra=0;k<=60&&extra<2;k++){document.execCommand('insertLineBreak');await typeCE(ed,t('demo.a2.line',{n:k}),30,60);await W(120);if(overflowing())extra++}
 await W(700);
 const bar=await demoFind('#pagesStack .sheet-flow-bar:not([hidden]) [data-act="flow-auto"]',6000);
 await moveTo(document.querySelector('#pagesStack .nex-sheet'),0.5,0.85);await W(500);

 const next=document.querySelector('#pagesStack .nex-sheet[data-sheet="1"]');if(next){next.scrollIntoView({block:'start',behavior:'smooth'});await W(1800)}
 // preview modes
 await caption('demo.c10',null,300);

 await tap(await demoFind('.pv-btn[data-view="grid"]'));await W(1500);

 // ④ export (pointing only — nothing is saved or downloaded)

}
async function runDemo(opts={}){
 if(demoActive)return;closeManual();saveNow();flushHistory();
 demoSnap={data:cloneData(data),page:pageIndex,tab:activeTab,view:previewView,open:new Set(openArticles),collapsed:new Set(openParts),folds:new Map(folds),search:searchText,undo:undoSnapshot,msg:flowMessage};
 demoActive=true;demoStop=false;demoSpeed=opts.speed||1;
 const layer=demoUI();const onKey=e=>{if(e.key==='Escape'){e.preventDefault();e.stopPropagation();demoStop=true}};document.addEventListener('keydown',onKey,true);
 data=blankIssue();pageIndex=0;openArticles.clear();openParts.clear();folds.clear();searchText='';undoSnapshot=null;flowMessage=[];
 const search=$('#articleSearch');if(search)search.value='';
 previewView='single';layoutPreview();renderPanels();renderPreview();showTab('info');
 try{await demoScript()}catch(e){if(!(e instanceof DemoStopped))console.warn('Demo stopped:',e.message)}
 finally{
  document.removeEventListener('keydown',onKey,true);layer.remove();getSelection().removeAllRanges();
  const s0=demoSnap;data=s0.data;pageIndex=Math.min(s0.page,data.pages.length-1);
  openArticles.clear();s0.open.forEach(x=>openArticles.add(x));openParts.clear();s0.collapsed.forEach(x=>openParts.add(x));folds.clear();s0.folds.forEach((v,k)=>folds.set(k,v));
  searchText=s0.search;if(search)search.value=s0.search;undoSnapshot=s0.undo;flowMessage=s0.msg;previewView=s0.view;
  demoActive=false;demoSnap=null;
  layoutPreview();renderPanels();renderPreview();showTab(s0.tab);paintStatus();paintHistory();
 }
}

/* ===== Start ===== */
applyTranslations();renderPanels();renderPreview();showTab(activeTab);recordHistory();
try{if(localStorage.getItem(MANUAL_KEY)!=='1')openManual(0,true)}catch(e){}
ensureImageSizes().then(n=>{if(n){persist();renderPreview()}});
window.NewsletterEditor={saveCanva,runDemo,get demoActive(){return demoActive},openManual,closeManual,ensureImageSizes,autoFlow,get data(){return data},get currentLanguage(){return currentLanguage},get pageIndex(){return pageIndex},translations,t,setLanguage,showTab,saveNow};
})();
