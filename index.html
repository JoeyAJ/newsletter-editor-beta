 "man.s1.title":"認識編輯器",
 "man.s1.lead":"左邊編輯、右邊即時預覽；左上角可隨時切換 繁體中文／한국어／English。",
 "man.s1.points":["依序完成四個步驟：① 基本資料 → ② 排版設計 → ③ 內容編輯 → ④ 匯出。", "右邊預覽就是印出來的樣子，每一頁固定為 A4。", "拖曳中間的「⋮」可調整左右兩邊的寬度。", "所有修改都會自動儲存在這台電腦的瀏覽器中。"],
 "man.s2.title":"填寫基本資料",
 "man.s2.lead":"在「① 基本資料」填寫這一期的資訊，會自動套用到每一頁的報頭與頁尾。",
 "man.s2.points":["學校名稱、主標題、副標題、月份、年度、期數。", "發行單位與地址會顯示在每一頁的頁尾。", "按「選擇圖片」上傳學校 Logo。", "最下方的「重設示範內容」會清空全部內容，使用前請先匯出 JSON 備份。"],
 "man.s3.title":"選擇版面與抬頭樣式",
 "man.s3.lead":"在「② 排版設計」點一下模板即可套用到目前頁面，右邊立即預覽。",
 "man.s3.points":["校友版型 A–D（溫暖敘事、現代連結、專業成長、同行未來）；其餘收在「更多版型」。", "16 款欄目抬頭樣式（例如 President’s Message 的外框）。", "每一頁可以用不同版面；續頁可改用「精簡頁首」節省空間。", "可勾選「空白圖片位置顯示示範圖片」，先看整體效果。"],
 "man.s4.title":"頁面、Part 與文章",
 "man.s4.lead":"在「③ 內容編輯」中，內容的結構是：A4 頁面 → Part（欄目區塊）→ 文章。",
 "man.s4.points":["「＋ 新增 A4 頁」增加頁面；點「1 / 3」等按鈕切換要編輯的頁面。", "「＋ 新增 Part」增加欄目，可放在左欄、右欄或全寬。", "Part 抬頭可從常用英文清單選擇，也可以自己輸入。", "點文章標題即可展開編輯；↑ ↓ 調整順序，「刪除」移除。"],
 "man.s5.title":"寫正文、放圖片",
 "man.s5.lead":"正文框就像文書軟體：直接打字，圖片會顯示在文字之間。",
 "man.s5.points":["在文字中點一下，再按「插入圖片」；也可以直接貼上（Ctrl+V）或把照片拖進框裡。", "用滑鼠拖動圖片即可換位置，藍色線就是放下的位置。", "把一張圖拖到另一張圖上，就會並排顯示；滑鼠移到圖上按 ✕ 刪除。", "選取文字後按「粗體」或 Ctrl+B 加粗。主圖與文末拼貼在「圖片設定」中。"],
 "man.s6.title":"內容太多？自動接到下一頁",
 "man.s6.lead":"超出 A4 的頁面會出現紅框，一鍵就能把多出的內容接續到下一頁。",
 "man.s6.points":["按「自動接續到下一頁」，沒有下一頁會自動新增，報頭與欄位都會沿用。", "第 1 頁結尾自動標示「（接下頁）」，下一頁標示「（續前頁）」。", "修改文字或圖片後，按「重新自動排版跨頁內容」重新分頁。", "也可以在文章中用「從游標處分割」或「整篇移到下一頁」自行調整。"],
 "man.s7.title":"切換預覽方式",
 "man.s7.lead":"預覽區上方可選擇「單頁」「雙頁」「多頁」，方便檢查整期內容。",
 "man.s7.points":["單頁：100% 大小，適合細看文字。", "雙頁：兩頁並排；多頁：全部頁面縮成小圖。", "點任一頁就切換到編輯那一頁；按兩下回到單頁。"],
 "man.s8.title":"匯出與列印",
 "man.s8.lead":"在「④ 匯出」先看校對清單與預檢，再產生 A4 PDF、PNG，或微信精簡版。",
 "man.s8.points":["PDF：按「列印／另存 PDF」，紙張選 A4、縮放 100%、邊界「無」，並勾選「背景圖形」。", "PNG：可保存目前頁，或把所有頁打包成一個 ZIP 檔。", "JSON：「匯出資料 JSON」備份；換電腦時用「匯入資料 JSON」還原。", "想加更多裝飾：按「匯出到 Canva（可編輯）」，再把檔案上傳到 Canva 繼續設計。"],
 "man.s9.title":"復原、快捷鍵與儲存",
 "man.s9.lead":"做錯了不用擔心，所有操作都可以復原。",
 "man.s9.points":["↶ 復原（Ctrl+Z）／↷ 重做（Ctrl+Y）；Ctrl+S 立即儲存。", "按「⌨ 快捷鍵」可隨時查看所有快捷鍵。", "資料存在這台電腦的瀏覽器裡；清除瀏覽器資料會遺失，請定期匯出 JSON。", "遇到問題，按頁面最下方的「聯絡我」與作者聯繫。"],

 "man.art.preview":"실시간 미리보기",
 "man.s1.title":"편집기 둘러보기",
 "man.s1.lead":"왼쪽에서 편집하고 오른쪽에서 실시간으로 확인합니다. 왼쪽 위에서 언제든지 繁體中文 / 한국어 / English로 바꿀 수 있습니다.",
 "man.s1.points":["네 단계를 차례로 진행하세요: ① 기본 정보 → ② 레이아웃 디자인 → ③ 콘텐츠 편집 → ④ 내보내기.", "오른쪽 미리보기가 실제 인쇄 모습이며, 각 페이지는 A4로 고정됩니다.", "가운데 ‘⋮’를 끌어 좌우 너비를 조절할 수 있습니다.", "모든 수정 내용은 이 컴퓨터의 브라우저에 자동 저장됩니다."],
 "man.s2.title":"기본 정보 입력",
 "man.s2.lead":"‘① 기본 정보’에 이번 호의 정보를 입력하면 모든 페이지의 제호와 하단에 자동으로 적용됩니다.",
 "man.s2.points":["학교명, 메인 제목, 부제목, 발행 월, 연도, 호수를 입력합니다.", "발행 기관과 주소는 모든 페이지 하단에 표시됩니다.", "‘이미지 선택’을 눌러 학교 로고를 올립니다.", "맨 아래 ‘예시 콘텐츠로 초기화’는 모든 내용을 지우므로, 먼저 JSON으로 백업하세요."],
 "man.s3.title":"레이아웃과 제목 스타일 선택",
 "man.s3.lead":"‘② 레이아웃 디자인’에서 템플릿을 클릭하면 현재 페이지에 바로 적용되고 오른쪽에서 확인할 수 있습니다.",
 "man.s3.points":["동문 템플릿 A–D(따뜻한 이야기, 현대적 연결, 전문성과 성장, 함께하는 미래). 나머지는 ‘더 많은 판형’에 있습니다.", "섹션 제목 스타일 16종 (예: President’s Message 테두리).", "페이지마다 다른 레이아웃을 쓸 수 있으며, 속지는 ‘간략 머리글’로 공간을 아낄 수 있습니다.", "‘이미지가 없는 자리에 예시 이미지 표시’로 전체 느낌을 먼저 확인해 보세요."],
 "man.s4.title":"페이지, 파트, 기사",
 "man.s4.lead":"‘③ 콘텐츠 편집’의 구조는 A4 페이지 → 파트(섹션) → 기사입니다.",
 "man.s4.points":["‘＋ A4 페이지 추가’로 페이지를 늘리고, ‘1 / 3’ 같은 버튼으로 편집할 페이지를 고릅니다.", "‘＋ 파트 추가’로 섹션을 만들고 왼쪽 단, 오른쪽 단, 전체 너비 중에 배치합니다.", "파트 제목은 자주 쓰는 영문 제목에서 고르거나 직접 입력합니다.", "기사 제목을 누르면 편집 창이 열리며, ↑ ↓로 순서를 바꾸고 ‘삭제’로 지웁니다."],
 "man.s5.title":"본문 쓰기와 이미지 넣기",
 "man.s5.lead":"본문 상자는 문서 프로그램처럼 바로 입력하면 되고, 이미지는 글 사이에 그대로 보입니다.",
 "man.s5.points":["글 사이를 클릭한 뒤 ‘이미지 넣기’를 누르거나, 이미지를 붙여넣기(Ctrl+V) 또는 끌어다 놓으세요.", "이미지를 마우스로 끌어 위치를 바꿉니다. 파란 선이 놓일 위치입니다.", "이미지를 다른 이미지 위에 놓으면 나란히 배치되고, 이미지 위의 ✕로 삭제합니다.", "글자를 선택하고 ‘굵게’ 또는 Ctrl+B를 누르세요. 대표 이미지와 기사 끝 콜라주는 ‘이미지 설정’에 있습니다."],
 "man.s6.title":"내용이 넘칠 때: 다음 페이지로 자동 이어서 배치",
 "man.s6.lead":"A4를 벗어난 페이지는 빨간 테두리로 표시되며, 버튼 하나로 넘친 내용을 다음 페이지로 옮길 수 있습니다.",
 "man.s6.points":["‘다음 페이지로 자동 이어서 배치’를 누르면 필요한 페이지가 자동으로 추가되고, 제호와 단 배치가 유지됩니다.", "앞 페이지 끝에는 ‘(다음 페이지에 계속)’, 다음 페이지에는 ‘(앞 페이지에서 계속)’이 표시됩니다.", "글이나 이미지를 수정한 뒤에는 ‘페이지 이어짐 다시 자동 배치’를 누르세요.", "기사에서 ‘커서 위치에서 나누기’나 ‘기사 전체를 다음 페이지로’로 직접 조정할 수도 있습니다."],
 "man.s7.title":"미리보기 방식 바꾸기",
 "man.s7.lead":"미리보기 위쪽에서 ‘한 페이지’, ‘두 페이지’, ‘여러 페이지’를 고를 수 있습니다.",
 "man.s7.points":["한 페이지: 100% 크기로 글자를 자세히 볼 때.", "두 페이지: 두 페이지를 나란히, 여러 페이지: 모든 페이지를 작은 그림으로.", "페이지를 클릭하면 그 페이지를 편집하고, 두 번 클릭하면 한 페이지 보기로 돌아갑니다."],
 "man.s8.title":"내보내기와 인쇄",
 "man.s8.lead":"‘④ 내보내기’에서 교정 목록과 사전 확인을 본 뒤 A4 PDF·PNG 또는 위챗 요약본을 만듭니다.",
 "man.s8.points":["PDF: ‘인쇄 / PDF로 저장’에서 용지 A4, 배율 100%, 여백 없음, ‘배경 그래픽’을 켜 주세요.", "PNG: 현재 페이지만 저장하거나, 모든 페이지를 ZIP 파일 하나로 저장합니다.", "JSON: ‘JSON으로 백업’으로 저장하고, 다른 컴퓨터에서는 ‘JSON 불러오기’로 복원합니다.", "장식을 더하고 싶다면 ‘Canva로 내보내기 (편집 가능)’를 누른 뒤 파일을 Canva에 올려 계속 디자인하세요."],
 "man.s9.title":"실행 취소, 단축키, 저장",
 "man.s9.lead":"실수해도 괜찮습니다. 모든 작업은 되돌릴 수 있습니다.",
 "man.s9.points":["↶ 실행 취소(Ctrl+Z) / ↷ 다시 실행(Ctrl+Y), Ctrl+S로 바로 저장합니다.", "‘⌨ 단축키’를 누르면 모든 단축키를 볼 수 있습니다.", "데이터는 이 컴퓨터의 브라우저에 저장됩니다. 브라우저 데이터를 지우면 사라지므로 JSON으로 자주 백업하세요.", "문제가 있으면 페이지 맨 아래 ‘문의하기’로 제작자에게 연락하세요."],

 "demo.c1":"① 기본 정보: 학교명, 메인 제목, 발행 월, 연도, 호수를 입력하면 오른쪽 미리보기에 바로 반영됩니다.",
 "demo.c2":"② 레이아웃 디자인: 동문 템플릿 A–D를 고른 다음 섹션 제목 스타일을 선택합니다.",

 "demo.c4":"기사를 펼쳐 제목과 본문을 입력합니다. 문서 프로그램처럼 쓰면 됩니다.",

 "demo.c7":"글자를 선택하고 ‘굵게’(또는 Ctrl+B)를 누릅니다.",
 "demo.c8":"오른쪽 단에 파트를 하나 더 추가합니다. 글이 A4를 넘치면 빨간 테두리가 나타납니다…",
 "demo.c9":"‘다음 페이지로 자동 이어서 배치’를 누르면 넘친 내용이 2페이지로 이어지고 제호도 그대로 유지됩니다.",
 "demo.c10":"미리보기를 ‘두 페이지’나 ‘여러 페이지’로 바꿔 전체를 한눈에 확인할 수 있습니다.",
 "demo.c11":"④ 내보내기: PDF로 인쇄하거나 모든 페이지를 PNG 압축 파일로 저장합니다. (데모에서는 실제로 내려받지 않습니다)",
 "demo.c12":"완료! 데모가 끝났고 원래 내용으로 돌아왔습니다.",

function newArticle(){return {id:uid(),title:'',body:'',image:'',qr:'',extraImages:[]}}
function normalizeArticle(a,legacy){
 a=a&&typeof a==='object'?a:{};
 const out={...a,id:a.id||uid(),title:String(a.title??''),body:String(a.body??''),image:typeof a.image==='string'?a.image:''};
 if(legacy){
  for(const [marker,tag] of LEGACY_SAMPLE_MARKERS){
   if(out.body===marker||out.body.startsWith(marker+'\n')){out.body=out.body.slice(marker.length).replace(/^\n/,'');out.sampleTag=tag;break}
  }
  if(LEGACY_DEFAULT_TITLES.includes(out.title))out.title='';
  if(LEGACY_DEFAULT_BODIES.includes(out.body))out.body='';
 }
 if(out.sampleTag!=='article'&&out.sampleTag!=='event')delete out.sampleTag;
 out.extraImages=(Array.isArray(a.extraImages)?a.extraImages:[]).map(im=>typeof im==='string'?{src:im,ratio:'original',fit:'contain',x:50,y:50}:im).filter(im=>im&&typeof im.src==='string'&&im.src).map(im=>im.id?im:{...im,id:shortId()});
 return out;
}
function normalizePart(x,legacy){
 x=x&&typeof x==='object'?x:{};
 let title=String(x.title??'');if(legacy&&LEGACY_DEFAULT_PARTS.includes(title))title='';
 const list=Array.isArray(x.articles)?x.articles:Array.isArray(x.stories)?x.stories:[];
 const part={id:x.id||uid(),title,position:POSITIONS.includes(x.position)?x.position:'full',articles:list.map(a=>normalizeArticle(a,legacy))};

function normalizePage(p,legacy){
 p=p&&typeof p==='object'?p:{};
 return {...(p.autoCreated?{autoCreated:true}:{}),id:p.id||uid(),header:HEADERS.includes(p.header)?p.header:'full',layout:LAYOUTS.includes(p.layout)?p.layout:'mode1',headingStyle:STYLES.includes(p.headingStyle)?p.headingStyle:'style1',parts:(Array.isArray(p.parts)?p.parts:[]).map(x=>normalizePart(x,legacy))};
}
/* Converts the old "left/right columns + extra parts" format into the unified Part model. */
function legacyPage(p,root){
 const pick=k=>p[k]!==undefined?p[k]:root[k];
 const parts=[
  {title:pick('leftLabel'),position:'left',articles:Array.isArray(pick('left'))?pick('left'):[]},
  {title:pick('rightLabel'),position:'right',articles:Array.isArray(pick('right'))?pick('right'):[]}
 ];
 for(const x of Array.isArray(p.parts)?p.parts:[])parts.push(x);
 return normalizePage({layout:pick('layout'),headingStyle:pick('headingStyle'),parts},true);
}
function normalizeData(raw){
 if(!raw||typeof raw!=='object'||Array.isArray(raw))throw new Error('invalid');
 const out={schema:2};
 for(const k of META_KEYS)out[k]=raw[k]==null?'':String(raw[k]);
 out.proof=normalizeProof(raw.proof);
 if(raw.mastTitle===undefined)out.mastTitle='ALUMNI';
 if(raw.schema===2){
  if(!Array.isArray(raw.pages))throw new Error('invalid');
  out.pages=raw.pages.map(p=>normalizePage(p,false));
 }else{
  const legacyPages=Array.isArray(raw.pages)&&raw.pages.length?raw.pages:null;
  if(!legacyPages&&!(Array.isArray(raw.left)&&Array.isArray(raw.right)))throw new Error('invalid');
  out.pages=(legacyPages||[raw]).map(p=>legacyPage(p&&typeof p==='object'?p:{},raw));
 }
 if(!out.pages.length)out.pages=[normalizePage({parts:[{title:'',position:'left'},{title:'',position:'right'}]},false)];
 return out;
}

/* ===== In-page dialogs =====
   The browser's own confirm and alert boxes are silently blocked in sandboxed previews (a confirm then
   answers "no", so deleting did nothing). These dialogs work everywhere and follow the interface language. */
function uiDialog(message,withCancel){
 return new Promise(resolve=>{
  const prev=document.activeElement,wrap=document.createElement('div');
  wrap.className='ui-dialog-overlay';
  wrap.innerHTML=`<div class="ui-dialog" role="${withCancel?'alertdialog':'dialog'}" aria-modal="true" aria-describedby="uiDialogMsg"><p id="uiDialogMsg"></p><div class="ui-dialog-actions">${withCancel?`<button type="button" class="btn secondary" id="uiDialogCancel">${esc(t('dialog.cancel'))}</button>`:''}<button type="button" class="btn" id="uiDialogOk">${esc(t('dialog.ok'))}</button></div></div>`;
  wrap.querySelector('#uiDialogMsg').textContent=message;
  const close=v=>{document.removeEventListener('keydown',onKey,true);wrap.remove();if(prev&&prev.isConnected)prev.focus();resolve(v)};
  const onKey=e=>{if(e.key==='Escape'){e.preventDefault();e.stopPropagation();close(false)}};
  wrap.addEventListener('click',e=>{if(e.target.id==='uiDialogOk')close(true);else if(e.target.id==='uiDialogCancel'||e.target===wrap)close(false)});
  document.addEventListener('keydown',onKey,true);
  document.body.appendChild(wrap);wrap.querySelector('#uiDialogOk').focus();
 });
}
const uiConfirm=msg=>uiDialog(msg,true),uiAlert=msg=>uiDialog(msg,false);

/* ===== Persistence ===== */
let saveTimer=null,saveState='idle',lastSaved=null,storageWarned=false;
/* ===== Undo / redo: snapshots of the data (image strings are shared, not copied) ===== */
let demoActive=false;
const HISTORY_MAX=80;let history=[],hIndex=-1,hTimer=null,restoring=false;
const cloneData=v=>Array.isArray(v)?v.map(cloneData):v&&typeof v==='object'?Object.fromEntries(Object.entries(v).map(([k,x])=>[k,cloneData(x)])):v;
const dataSig=d=>JSON.stringify(d,(k,v)=>typeof v==='string'&&v.length>300?v.length+':'+v.slice(-48):v);
function recordHistory(){
 if(demoActive)return;
 clearTimeout(hTimer);hTimer=null;const sig=dataSig(data);
 if(history[hIndex]&&history[hIndex].sig===sig){history[hIndex].page=pageIndex;return}
 history=history.slice(0,hIndex+1);history.push({sig,data:cloneData(data),page:pageIndex});
 if(history.length>HISTORY_MAX)history.shift();hIndex=history.length-1;paintHistory();
}
const flushHistory=()=>{if(hTimer)recordHistory()};
function scheduleHistory(){if(restoring||demoActive)return;clearTimeout(hTimer);hTimer=setTimeout(recordHistory,400)}
function paintHistory(){const u=$('#undoBtn'),r=$('#redoBtn');if(u)u.disabled=!(hIndex>0||hTimer);if(r)r.disabled=hIndex>=history.length-1}
function stepHistory(d){
 if(hTimer)recordHistory();
 const n=hIndex+d;if(n<0||n>=history.length)return;
 restoring=true;
 try{hIndex=n;const h=history[n];data=cloneData(h.data);pageIndex=Math.min(Math.max(0,h.page),data.pages.length-1);undoSnapshot=null;flowMessage=[];saveNow();renderPanels();renderPreview()}
 finally{restoring=false}
 paintHistory();
}
function persist(){if(demoActive)return;clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,250);scheduleHistory();paintHistory()}
function saveNow(){
 if(demoActive)return;
 clearTimeout(saveTimer);saveTimer=null;
 scheduleHistory();
 try{localStorage.setItem(STORAGE_KEY,JSON.stringify(data));saveState='saved';lastSaved=new Date()}
 catch(err){saveState='failed';if(!storageWarned){storageWarned=true;uiAlert(t('msg.storageFull'))}}

}

/* ===== Body editor (what you see is what you get) =====
   Text and pictures are edited in one box. Storage stays plain text: **bold** inside a line, and a
   picture row is a line of [[IMG:id]] codes. Users never see either. */
const inlineHTML=(line,tag='b')=>esc(line).replace(/\*\*(.+?)\*\*/g,`<${tag}>$1</${tag}>`);
function ceFigHTML(imgs){
 return `<figure class="ce-fig" contenteditable="false">${imgs.map(x=>`<span class="ce-img" draggable="true" data-id="${esc(x.id)}"><img src="${esc(x.src)}" alt="" draggable="false"><button type="button" class="ce-x" data-act="ce-img-del" tabindex="-1" title="${esc(t('blk.removeImg'))}" aria-label="${esc(t('blk.removeImg'))}">✕</button></span>`).join('')}</figure>`;
}
function ceHTML(a){
 const byId=new Map(a.extraImages.map(x=>[x.id,x]));let html='',prevText=false;
 for(const line of String(a.body??'').split('\n')){
  const ids=[...line.matchAll(IMG_TOKEN)].map(m=>m[1]).filter(id=>byId.has(id)),rest=line.replace(IMG_TOKEN,'');
  if(ids.length){if(rest.trim()){if(prevText)html+='<br>';html+=inlineHTML(rest.trim())}html+=ceFigHTML(ids.map(id=>byId.get(id)));prevText=false}
  else{if(prevText)html+='<br>';html+=inlineHTML(rest);prevText=true}
 }
 /* a trailing <br> keeps the last empty line / the spot after a final picture reachable */
 if(/(<br>|<\/figure>)$/.test(html))html+='<br>';
 return html;
}
/* Editor DOM → stored text. partial=true is used to measure the text before the cursor. */
function ceSerialize(root,partial){
 const lines=[''];let open=false,afterFig=false,pend=false;
 const last=()=>lines.length-1;
 const closeBold=()=>{if(open){lines[last()]+='**';open=false}};
 const newline=()=>{closeBold();lines.push('')};
 const flushPend=()=>{if(pend){pend=false;if(afterFig)afterFig=false;newline()}};
 const addText=(s,b)=>{s=s.replace(/ /g,' ').replace(/[​﻿]/g,'');if(!s)return;
  flushPend();if(afterFig){lines.push('');afterFig=false}
  const parts=s.split('\n');parts.forEach((piece,k)=>{if(k)newline();if(!piece)return;if(b!==open){lines[last()]+='**';open=b}lines[last()]+=piece});};
 const addFig=ids=>{pend=false;closeBold();if(lines[last()]!==''||afterFig)lines.push('');lines[last()]=ids.map(id=>`[[IMG:${id}]]`).join(' ');afterFig=true};
 const walk=(node,b)=>{for(const n of node.childNodes){
  if(n.nodeType===3){addText(n.nodeValue,b);continue}
  if(n.nodeType!==1||n.matches('.ce-x,.ce-drop-line'))continue;
  if(n.matches('figure.ce-fig')){const ids=[...n.querySelectorAll('[data-id]')].map(x=>x.dataset.id);if(ids.length)addFig(ids);continue}
  if(n.tagName==='BR'){
   if(/^(DIV|P|LI)$/.test(n.parentElement.tagName)&&n.parentElement!==root&&!n.nextSibling)continue;
   flushPend();if(afterFig){afterFig=false;lines.push('')}else newline();continue}
  const bold=b||/^(B|STRONG)$/.test(n.tagName)||n.style.fontWeight==='bold'||Number(n.style.fontWeight)>=600;
  const block=/^(DIV|P|LI|H[1-6]|BLOCKQUOTE)$/.test(n.tagName);
  if(block){if(pend)flushPend();else if(lines[last()]!==''||afterFig){if(afterFig){afterFig=false;lines.push('')}else newline()}}
  walk(n,bold);
  if(block)pend=true;
 }};
 walk(root,false);
 if(!partial)closeBold();
 let out=lines.join('\n');
 if(!partial&&root.lastChild&&root.lastChild.nodeName==='BR'&&out.endsWith('\n'))out=out.slice(0,-1);
 return out;
}

/* ===== Preview ===== */
/* Body markup is shared by the preview and the page-flow measurement so both lay out identically. */
const RATIO_CSS={square:'1/1',landscape:'4/3',wide:'16/9',portrait:'3/4'};
/* One picture in a collage or inline row. A single picture keeps its own proportions; several pictures
   share a tidy 4:3 cell (or the ratio chosen for that picture) so rows line up. */
function figImg(x,cols,mode){
 const natural=x.w&&x.h?`${x.w}/${x.h}`:'4/3',fixed=RATIO_CSS[x.ratio];
 const fit=fixed?'cover':cols===1?(x.fit==='cover'?'cover':'contain'):(mode==='grid-contain'?'contain':'cover');
 const pos=`object-fit:${fit};object-position:${num(x.x)}% ${num(x.y)}%`,src=`src="${esc(x.src)}" alt="${esc(t('preview.extraImageAlt'))}"`;
 /* A lone picture keeps its proportions, is centred and capped in height; width/height attributes give
    the browser its size before decoding so page-flow measuring is exact. */
 if(cols===1&&!fixed&&x.w&&x.h)return `<img class="article-image extra-preview gimg single natural" width="${x.w}" height="${x.h}" style="${pos}" ${src}>`;
 return `<img class="article-image extra-preview gimg${cols===1?' single':''}" style="aspect-ratio:${fixed||(cols===1?natural:'4/3')};${pos}" ${src}>`;
}
/* Body text with image codes ([[IMG:id]]) turned into pictures at that spot; codes on one line sit side by side. */
function richBody(a,text){
 const byId=new Map(a.extraImages.map(x=>[x.id,x]));let html='',buf=[];
 const flush=()=>{if(buf.length){html+=buf.map(l=>inlineHTML(l,'strong')).join('\n');buf=[]}};
 for(const line of String(text).split('\n')){
  const ids=[...line.matchAll(IMG_TOKEN)].map(m=>m[1]).filter(id=>byId.has(id));
  if(!ids.length){buf.push(line);continue}
  const rest=line.replace(IMG_TOKEN,'').trim();if(rest)buf.push(rest);
  flush();const k=Math.min(ids.length,3);
  html+=`<div class="inline-figs" style="grid-template-columns:repeat(${k},minmax(0,1fr))">${ids.map(id=>figImg(byId.get(id),ids.length===1?1:k,'grid-cover')).join('')}</div>`;
 }
 flush();return html;
}
function galleryHTML(a,pos){
 const placed=placedIds(a.body),list=a.extraImages.filter(x=>!placed.has(x.id));
 if(!list.length)return '';
 const mode=['grid-cover','grid-contain','stack'].includes(a.galleryMode)?a.galleryMode:'grid-cover';
 if(mode==='stack')return `<div class="extra-gallery stack">${list.map(x=>{const ratio=CROPS.includes(x.ratio)&&x.ratio!=='original'?'crop-'+x.ratio:'crop-original';const fit=x.ratio&&x.ratio!=='original'?'cover':(x.fit==='cover'?'cover':'contain');return `<img class="article-image extra-preview ${ratio}" style="object-fit:${fit};object-position:${num(x.x)}% ${num(x.y)}%" src="${esc(x.src)}" alt="${esc(t('preview.extraImageAlt'))}">`}).join('')}</div>`;
 const n=list.length,want=Number(a.galleryCols);
 const cols=want>=1&&want<=4?Math.min(want,n):pos==='full'?(n<=4?n:n<=6?3:4):(n===1?1:2);
 return `<div class="extra-gallery" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">${list.map(x=>figImg(x,cols,mode)).join('')}</div>`;
}

function manualHTML(){
 const i=manualStep,points=t(`man.s${i+1}.points`),last=i===MANUAL_STEPS-1;
 let seen=false;try{seen=localStorage.getItem(MANUAL_KEY)==='1'}catch(e){}

<section class="manual-main"><div class="manual-top"><span class="manual-count">${esc(t('man.step',{n:i+1,total:MANUAL_STEPS}))}</span><button type="button" class="demo-play demo-play-narrow" data-man="demo">${esc(t('demo.play'))}</button><button type="button" class="manual-x" data-man="close" aria-label="${esc(t('man.close'))}" title="${esc(t('man.close'))}">✕</button></div>
<h2 id="manualTitle">${esc(t(`man.s${i+1}.title`))}</h2><div class="manual-art">${manualArt(i)}</div><p class="manual-lead">${esc(t(`man.s${i+1}.lead`))}</p><ul class="manual-points">${points.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
<div class="manual-dots" aria-hidden="true">${Array.from({length:MANUAL_STEPS},(_,k)=>`<span${k===i?' class="on"':''}></span>`).join('')}</div>
<div class="manual-foot"><label class="manual-check"><input type="checkbox" id="manualDontShow"${seen||manualAuto?' checked':''}> ${esc(t('man.dontShow'))}</label><div class="manual-buttons"><button type="button" class="btn secondary" data-man="show">${esc(t('man.show'))}</button><button type="button" class="btn secondary" data-man="prev"${i===0?' disabled':''}>${esc(t('man.prev'))}</button><button type="button" class="btn" data-man="${last?'close':'next'}">${esc(t(last?'man.done':'man.next'))}</button></div></div></section></div>`;
}
let manualAuto=false;
function openManual(step,auto){
 manualAuto=!!auto;if(step!==undefined)manualStep=Math.min(Math.max(0,step),MANUAL_STEPS-1);
 document.querySelector('.manual-back')?.remove();
 let ov=$('#manualOverlay');if(!ov){ov=document.createElement('div');ov.id='manualOverlay';ov.className='manual-overlay';document.body.appendChild(ov)}
 ov.innerHTML=manualHTML();ov.classList.add('is-open');ov.querySelector('[data-man="next"],[data-man="close"].btn')?.focus();
}
function closeManual(){
 const ov=$('#manualOverlay');if(!ov)return;
 const cb=$('#manualDontShow');try{if(!cb||cb.checked)localStorage.setItem(MANUAL_KEY,'1');else localStorage.removeItem(MANUAL_KEY)}catch(e){}
 ov.classList.remove('is-open');ov.innerHTML='';$('#manualBtn')?.focus();
}
/* "Show me": close the manual, open the right module and pulse the real control. */
function showMe(i){
 closeManual();
 const tab=[null,'info','layout','content','content','content',null,'export',null][i];if(tab)showTab(tab);
 if(i===4){const it=document.querySelector('#partsEdit .article-item');if(it){const btn=it.querySelector('[data-act="art-toggle"]');if(btn&&btn.getAttribute('aria-expanded')!=='true')btn.click()}}
 const sel=['.ux-nav','#metadata','.template-gallery','#pagesPanel','#partsEdit .ce-field','#overflowWarning:not([hidden]),#pagesPanel','.preview-toolbar','.export-actions','.ux-actions'][i];
 const el=[...document.querySelectorAll(sel)].find(x=>x.offsetParent!==null);
 if(el){el.scrollIntoView({block:'center',behavior:'smooth'});el.classList.remove('tour-spot');void el.offsetWidth;el.classList.add('tour-spot');setTimeout(()=>el.classList.remove('tour-spot'),3600)}
 const back=document.createElement('button');back.type='button';back.className='manual-back';back.textContent='↩ '+t('man.back');back.addEventListener('click',()=>openManual(i));
 document.body.appendChild(back);setTimeout(()=>back.remove(),12000);
}
document.addEventListener('click',e=>{const ov=$('#manualOverlay');if(!ov||!ov.classList.contains('is-open'))return;
 if(e.target===ov){closeManual();return}
 const step=e.target.closest('[data-man-step]');if(step){openManual(Number(step.dataset.manStep),manualAuto);return}
 const b=e.target.closest('[data-man]');if(!b)return;const a=b.dataset.man;
 if(a==='demo'){runDemo();return}
 if(a==='close')closeManual();else if(a==='next')openManual(manualStep+1,manualAuto);else if(a==='prev')openManual(manualStep-1,manualAuto);else if(a==='show')showMe(manualStep);
});
document.addEventListener('keydown',e=>{const ov=$('#manualOverlay');if(!ov||!ov.classList.contains('is-open'))return;
 if(e.key==='Escape'){e.preventDefault();closeManual()}
 else if(e.key==='ArrowRight'&&manualStep<MANUAL_STEPS-1&&!e.target.matches('input')){e.preventDefault();openManual(manualStep+1,manualAuto)}
 else if(e.key==='ArrowLeft'&&manualStep>0&&!e.target.matches('input')){e.preventDefault();openManual(manualStep-1,manualAuto)}
});

/* ===== Animated demo: a visible cursor builds an issue from scratch in the real editor =====
   The user's data is snapshotted first; saving and history are paused; everything is restored at the end. */
let demoStop=false,demoSpeed=1,demoSnap=null;
const DEMO_PACE=1.3; /* base tempo: a full run at 1× takes about a minute */
class DemoStopped extends Error{}
const dsleep=ms=>new Promise((res,rej)=>{const end=Date.now()+ms/(demoSpeed*DEMO_PACE);(function tick(){if(demoStop)return rej(new DemoStopped());if(Date.now()>=end)return res();setTimeout(tick,Math.min(60,end-Date.now()))})()});
const visible=sel=>[...document.querySelectorAll(sel)].find(x=>x.offsetParent!==null||x.getClientRects().length);
async function demoFind(sel,timeout=4000){const end=Date.now()+timeout;for(;;){const el=visible(sel);if(el)return el;if(Date.now()>end)throw new Error('demo: missing '+sel);await dsleep(80)}}
function demoUI(){
 const wrap=document.createElement('div');wrap.id='demoLayer';
 wrap.innerHTML=`<div class="demo-blocker"></div><div class="demo-cursor" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 2l16 11-7 1.5 4 7.5-3 1.5-4-7.5L4 21z" fill="#fff" stroke="#111" stroke-width="1.5" stroke-linejoin="round"/></svg></div><div class="demo-bar" role="status" aria-live="polite"><span class="demo-badge">${esc(t('demo.label'))}</span><p class="demo-caption"></p><div class="demo-controls"><button type="button" class="demo-speed">${esc(t('demo.fast'))}</button><button type="button" class="demo-stop">${esc(t('demo.stop'))}</button></div></div>`;
 document.body.appendChild(wrap);
 wrap.querySelector('.demo-stop').addEventListener('click',()=>{demoStop=true});
 wrap.querySelector('.demo-speed').addEventListener('click',e=>{demoSpeed=demoSpeed===1?2:1;e.target.textContent=t(demoSpeed===1?'demo.fast':'demo.normal')});
 const c=wrap.querySelector('.demo-cursor');c.style.transform=`translate(${innerWidth/2}px,${innerHeight/2}px)`;
 return wrap;
}
const demoCursor=()=>document.querySelector('#demoLayer .demo-cursor');
async function caption(key,vars,hold=1400){const el=document.querySelector('#demoLayer .demo-caption');el.classList.remove('show');void el.offsetWidth;el.textContent=t(key,vars);el.classList.add('show');await dsleep(hold)}
async function moveTo(el,dx=0.5,dy=0.5){
 el.scrollIntoView({block:'center',inline:'nearest',behavior:'smooth'});await dsleep(380);
 const r=el.getBoundingClientRect(),c=demoCursor();c.style.transitionDuration=(0.65/(demoSpeed*DEMO_PACE))+'s';
 c.style.transform=`translate(${r.left+r.width*dx}px,${r.top+r.height*dy}px)`;await dsleep(720);
}
async function tap(el,doClick=true){
 await moveTo(el);const r=el.getBoundingClientRect(),dot=document.createElement('div');dot.className='demo-ripple';
 dot.style.left=(r.left+r.width/2)+'px';dot.style.top=(r.top+r.height/2)+'px';document.getElementById('demoLayer').appendChild(dot);setTimeout(()=>dot.remove(),700);
 demoCursor().classList.add('press');await dsleep(140);demoCursor().classList.remove('press');
 if(doClick)el.click();await dsleep(420);
}
async function typeInto(el,text,per=26){await moveTo(el);el.focus();for(const ch of text){if(demoStop)throw new DemoStopped();el.value+=ch;el.dispatchEvent(new Event('input',{bubbles:true}));await dsleep(per)}}
function caretToEnd(ed){ed.focus();const r=document.createRange();r.selectNodeContents(ed);r.collapse(false);const s=getSelection();s.removeAllRanges();s.addRange(r)}
async function typeCE(ed,text,per=24,chunk=2){caretToEnd(ed);for(let i=0;i<text.length;i+=chunk){if(demoStop)throw new DemoStopped();document.execCommand('insertText',false,text.slice(i,i+chunk));await dsleep(per)}}
async function selectOption(sel,value){await tap(sel,false);sel.value=value;sel.dispatchEvent(new Event('change',{bubbles:true}));await dsleep(500)}
function demoImage(kind){
 return new Promise(res=>{const c=document.createElement('canvas');c.width=960;c.height=640;const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,640);g.addColorStop(0,kind?'#ffd9a8':'#9fd0f5');g.addColorStop(1,kind?'#fff2df':'#e8f5ff');x.fillStyle=g;x.fillRect(0,0,960,640);
  x.fillStyle=kind?'#f59f4c':'#ffffff';x.beginPath();x.arc(760,130,70,0,7);x.fill();
  x.fillStyle=kind?'#5b8f6a':'#5d7fa3';x.fillRect(0,470,960,170);
  const blds=kind?[[90,260,170,220,'#c96f4a'],[300,200,210,280,'#e3a45a'],[560,250,160,230,'#b85d3c']]:[[60,300,330,180,'#e6eef6'],[420,240,420,240,'#d4e2ef']];
  for(const [bx,by,bw,bh,bc] of blds){x.fillStyle=bc;x.fillRect(bx,by,bw,bh);x.fillStyle='#ffffffaa';for(let wy=by+24;wy<by+bh-30;wy+=46)for(let wx=bx+20;wx<bx+bw-30;wx+=46)x.fillRect(wx,wy,24,26)}
  for(let i=0;i<9;i++){const px=120+i*85,py=520+(i%2)*18;x.fillStyle=['#2f5f8f','#c2453a','#3c8d5f','#7b4fa0'][i%4];x.beginPath();x.arc(px,py-38,15,0,7);x.fill();x.fillRect(px-14,py-22,28,46)}
  if(!kind){x.fillStyle='#ffffff';x.beginPath();x.moveTo(170,120);x.lineTo(420,150);x.lineTo(170,180);x.closePath();x.fill();x.fillRect(240,95,40,110)}
  c.toBlob(b=>res(new File([b],kind?'campus.png':'airport.png',{type:'image/png'})),'image/png')});
}

async function runDemo(opts={}){
 if(demoActive)return;closeManual();saveNow();flushHistory();
 demoSnap={data:cloneData(data),page:pageIndex,tab:activeTab,view:previewView,open:new Set(openArticles),collapsed:new Set(collapsedParts),folds:new Map(folds),search:searchText,undo:undoSnapshot,msg:flowMessage};
 demoActive=true;demoStop=false;demoSpeed=opts.speed||1;
 const layer=demoUI();const onKey=e=>{if(e.key==='Escape'){e.preventDefault();e.stopPropagation();demoStop=true}};document.addEventListener('keydown',onKey,true);
 data=blankIssue();pageIndex=0;openArticles.clear();collapsedParts.clear();folds.clear();searchText='';undoSnapshot=null;flowMessage=[];
 const search=$('#articleSearch');if(search)search.value='';
 previewView='single';layoutPreview();renderPanels();renderPreview();showTab('info');
 try{await demoScript()}catch(e){if(!(e instanceof DemoStopped))console.warn('Demo stopped:',e.message)}
 finally{
  document.removeEventListener('keydown',onKey,true);layer.remove();getSelection().removeAllRanges();
  const s0=demoSnap;data=s0.data;pageIndex=Math.min(s0.page,data.pages.length-1);
  openArticles.clear();s0.open.forEach(x=>openArticles.add(x));collapsedParts.clear();s0.collapsed.forEach(x=>collapsedParts.add(x));folds.clear();s0.folds.forEach((v,k)=>folds.set(k,v));
  searchText=s0.search;if(search)search.value=s0.search;undoSnapshot=s0.undo;flowMessage=s0.msg;previewView=s0.view;
  demoActive=false;demoSnap=null;
  layoutPreview();renderPanels();renderPreview();showTab(s0.tab);paintStatus();paintHistory();
 }
}
